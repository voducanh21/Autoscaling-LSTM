mode: standalone
replicas: 1

persistence:
  enabled: true
  size: 10Gi
  storageClass: standard

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

service:
  type: NodePort
  nodePorts:
    api: 30000
    console: 30001

buckets:
  - name: mlflow
  - name: airflow-logs
rootUser: admin
rootPassword: admin123
