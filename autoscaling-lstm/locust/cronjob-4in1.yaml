apiVersion: batch/v1
kind: CronJob
metadata:
  name: locust-phased-loadtest
  namespace: loadtest
spec:
  schedule: "0 */4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: locust
              image: locustio/locust:2.23.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "[RUN] Starting phased load test"
                  /bin/sh /mnt/scripts/loadtest-phased.sh
              env:
                - name: HOST
                  value: "http://api-gateway.apps.svc.cluster.local:8888"
                - name: PROM_URL
                  value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
                - name: USER_EMAIL
                  value: "test1@example.com"
                - name: USER_PASSWORD
                  value: "password123"
              volumeMounts:
                - name: locustfile
                  mountPath: /mnt/locust/
                - name: loadtest-scripts
                  mountPath: /mnt/scripts/
          volumes:
            - name: locustfile
              configMap:
                name: locustfile-phased
            - name: loadtest-scripts
              configMap:
                name: loadtest-phased-script

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-phased-script
  namespace: loadtest
data:
  loadtest-phased.sh: |
    #!/bin/sh

    echo "[START] Phase 1 — 100 users / 15m"
    locust -f /mnt/locust/locustfile.py --headless \
      --users 100 --spawn-rate 10 --run-time 15m

    echo "\n[START] Phase 2 — 200 users / 15m"
    locust -f /mnt/locust/locustfile.py --headless \
      --users 200 --spawn-rate 20 --run-time 15m

    echo "\n[START] Phase 3 — 400 users / 15m"
    locust -f /mnt/locust/locustfile.py --headless \
      --users 400 --spawn-rate 40 --run-time 15m

    echo "\n[START] Phase 4 — 550 users / 15m"
    locust -f /mnt/locust/locustfile.py --headless \
      --users 550 --spawn-rate 50 --run-time 15m

    echo "\n[DONE] Finished 60-minute stress test."

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile-phased
  namespace: loadtest
data:
  locustfile.py: |
    import os
    from locust import FastHttpUser, task, between

    HOST = os.getenv("HOST", "http://api-gateway.apps.svc.cluster.local:8888")
    TIMEOUT = float(os.getenv("TIMEOUT", "5"))
    USER_EMAIL = os.getenv("USER_EMAIL", "test1@example.com")
    USER_PASSWORD = os.getenv("USER_PASSWORD", "password123")
    VALID_PRODUCT_ID = int(os.getenv("VALID_PRODUCT_ID", "1"))

    AUTH_LOGIN_PATH = "/api/auth/login"
    PRODUCTS_LIST_PATH = "/api/products"
    ORDER_CREATE_PATH = "/api/order/place-order"
    PAYMENT_MODES_PATH = "/api/payment/modes"

    W_AUTH, W_PROD, W_ORDER, W_PAYMOD = 1, 2, 2, 2

    class ApiGatewayUser(FastHttpUser):
        host = HOST
        wait_time = between(0.5, 1.5)
        headers = {}

        def on_start(self):
            try:
                r = self.client.post(
                    AUTH_LOGIN_PATH,
                    json={"email": USER_EMAIL, "password": USER_PASSWORD},
                    timeout=TIMEOUT,
                    name="login"
                )
                if r.status_code == 200:
                    tok = r.json().get("token") or r.json().get("access_token")
                    if tok:
                        self.headers = {"Authorization": f"Bearer {tok}"}
            except Exception:
                pass

        @task(W_PROD)
        def products(self):
            self.client.get(PRODUCTS_LIST_PATH, name="products", timeout=TIMEOUT)

        @task(W_ORDER)
        def order(self):
            if self.headers:
                self.client.post(
                    ORDER_CREATE_PATH,
                    json={"items": [{"productId": VALID_PRODUCT_ID, "quantity": 1}]},
                    headers=self.headers,
                    name="order",
                    timeout=TIMEOUT
                )

        @task(W_PAYMOD)
        def paymodes(self):
            self.client.get(PAYMENT_MODES_PATH, name="payment_modes", timeout=TIMEOUT)
