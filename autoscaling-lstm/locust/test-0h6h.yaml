apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile-15m
  namespace: loadtest
data:
  locustfile.py: |
    import os, time, threading, requests
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from locust import FastHttpUser, task, between, events

    HOST = os.getenv("HOST")
    PROM_URL = os.getenv("PROM_URL")
    TIMEOUT = float(os.getenv("TIMEOUT", "5"))
    CHECK_INTERVAL = int(os.getenv("CHECK_INTERVAL", "30"))

    RUN_MINUTES = int(os.getenv("RUN_MINUTES", "15"))   # chạy đúng 15 phút

    AUTH_LOGIN_PATH     = "/api/auth/login"
    PRODUCTS_LIST_PATH  = "/api/products"
    ORDER_CREATE_PATH   = "/api/order/place-order"
    PAYMENT_MODES_PATH  = "/api/payment/modes"

    USER_EMAIL    = os.getenv("USER_EMAIL")
    USER_PASSWORD = os.getenv("USER_PASSWORD")
    VALID_PRODUCT_ID = int(os.getenv("VALID_PRODUCT_ID", "1"))

    # Weight giống 0h–6h
    W_AUTH, W_PROD, W_ORDER, W_PAYMOD = 1, 10, 4, 4

    class ApiGatewayUser(FastHttpUser):
        host = HOST
        wait_time = between(1, 3)
        headers = {}

        def on_start(self):
            try:
                r = self.client.post(
                    AUTH_LOGIN_PATH,
                    json={"email": USER_EMAIL, "password": USER_PASSWORD},
                    timeout=TIMEOUT,
                    name="login"
                )
                if r.status_code == 200:
                    tok = r.json().get("token") or r.json().get("access_token")
                    if tok:
                        self.headers = {"Authorization": f"Bearer {tok}"}
            except:
                pass

        @task(W_PROD)
        def products(self):
            self.client.get(PRODUCTS_LIST_PATH, name="products", timeout=TIMEOUT)

        @task(W_ORDER)
        def order(self):
            if self.headers:
                self.client.post(
                    ORDER_CREATE_PATH,
                    json={"items": [{"productId": VALID_PRODUCT_ID, "quantity": 1}]},
                    headers=self.headers,
                    name="order",
                    timeout=TIMEOUT
                )

        @task(W_PAYMOD)
        def paymodes(self):
            self.client.get(PAYMENT_MODES_PATH, name="payment_modes", timeout=TIMEOUT)

    # Query Prometheus
    def q(query: str) -> float:
        try:
            r = requests.get(f"{PROM_URL}/api/v1/query", params={"query": query}, timeout=5)
            data = r.json()
            if data["status"] == "success" and data["data"]["result"]:
                return float(data["data"]["result"][0]["value"][1])
        except:
            pass
        return 0.0

    # Background monitor
    def monitor():
        start = time.time()
        while True:
            time.sleep(CHECK_INTERVAL)
            elapsed = time.time() - start
            rps = q('svc:qps:rate1m{job="api-gateway"}')
            cpu = q('pod:cpu:usage1m{namespace="apps",pod=~"api-gateway-.*"}') * 1000
            mem = q('pod:mem:usage{namespace="apps",pod=~"api-gateway-.*"}') / (1024 * 1024)
            print(f"[MONITOR] {elapsed:.0f}s | RPS={rps:.1f} | CPU={cpu:.0f}m | MEM={mem:.1f}MiB")

    # Stop in 15 minutes
    def auto_stop():
        time.sleep(RUN_MINUTES * 60)
        print(f"[STOP] {RUN_MINUTES} phút đã trôi qua — tự dừng job.")
        os._exit(0)

    @events.test_start.add_listener
    def on_test_start(environment, **_):
        threading.Thread(target=monitor, daemon=True).start()
        threading.Thread(target=auto_stop, daemon=True).start()

    @events.test_stop.add_listener
    def on_test_stop(environment, **_):
        print("[CLEANUP] Test stopped.")
---
