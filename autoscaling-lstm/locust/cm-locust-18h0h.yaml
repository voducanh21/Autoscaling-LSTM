apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile-18h0h
  namespace: loadtest
data:
  locustfile.py: |
    import os, time, threading, requests
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from locust import FastHttpUser, task, between, events

    # === ENVIRONMENT ===
    HOST = os.getenv("HOST", "http://api-gateway.apps.svc.cluster.local:8888")
    PROM_URL = os.getenv("PROM_URL", "http://prometheus-operated.monitoring.svc.cluster.local:9090")
    TIMEOUT = float(os.getenv("TIMEOUT", "5"))
    CHECK_INTERVAL = int(os.getenv("CHECK_INTERVAL", "30"))   # seconds
    STOP_HOUR = int(os.getenv("STOP_HOUR", "0"))             # Giờ kết thúc theo VN time

    AUTH_LOGIN_PATH     = "/api/auth/login"
    PRODUCTS_LIST_PATH  = "/api/products"
    ORDER_CREATE_PATH   = "/api/order/place-order"
    PAYMENT_MODES_PATH  = "/api/payment/modes"

    USER_EMAIL    = os.getenv("USER_EMAIL", "test1@example.com")
    USER_PASSWORD = os.getenv("USER_PASSWORD", "password123")
    VALID_PRODUCT_ID = int(os.getenv("VALID_PRODUCT_ID", "1"))

    # === WEIGHT CONFIG ===
    # Use integer weights (Locust requires integers)
    W_AUTH, W_PROD, W_ORDER, W_PAYMOD = 10, 100, 36, 36

    class ApiGatewayUser(FastHttpUser):
        host = HOST
        wait_time = between(1, 3)
        headers = {}

        def on_start(self):
            """Đăng nhập khi bắt đầu user"""
            try:
                r = self.client.post(
                    AUTH_LOGIN_PATH,
                    json={"email": USER_EMAIL, "password": USER_PASSWORD},
                    timeout=TIMEOUT,
                    name="login"
                )
                if r.status_code == 200:
                    tok = r.json().get("token") or r.json().get("access_token")
                    if tok:
                        self.headers = {"Authorization": f"Bearer {tok}"}
            except Exception:
                pass

        @task(W_PROD)
        def products(self):
            self.client.get(PRODUCTS_LIST_PATH, name="products", timeout=TIMEOUT)

        @task(W_ORDER)
        def order(self):
            if self.headers:
                self.client.post(
                    ORDER_CREATE_PATH,
                    json={"items": [{"productId": VALID_PRODUCT_ID, "quantity": 1}]},
                    headers=self.headers,
                    name="order",
                    timeout=TIMEOUT
                )

        @task(W_PAYMOD)
        def paymodes(self):
            self.client.get(PAYMENT_MODES_PATH, name="payment_modes", timeout=TIMEOUT)


    # === PROMETHEUS QUERY ===
    def q(query: str) -> float:
        try:
            r = requests.get(f"{PROM_URL}/api/v1/query", params={"query": query}, timeout=5)
            data = r.json()
            if data["status"] == "success" and data["data"]["result"]:
                return float(data["data"]["result"][0]["value"][1])
        except Exception:
            pass
        return 0.0


    # === BACKGROUND MONITOR (theo dõi RPS, CPU, MEM) ===
    def monitor():
        start = time.time()
        while True:
            time.sleep(CHECK_INTERVAL)
            rps = q('svc:qps:rate1m{job="api-gateway"}')
            cpu = q('pod:cpu:usage1m{namespace="apps",pod=~"api-gateway-.*"}') * 1000
            mem_bytes = q('pod:mem:usage{namespace="apps",pod=~"api-gateway-.*"}')
            mem_mib = mem_bytes / (1024 * 1024)
            elapsed = time.time() - start
            print(f"[MONITOR] {elapsed:.0f}s | RPS={rps:.1f} | CPU={cpu:.0f}m | MEM={mem_mib:.1f}MiB")


    # === THREAD STOP TỰ ĐỘNG THEO GIỜ VN ===
    def stop_at_target_hour():
        tz = ZoneInfo("Asia/Ho_Chi_Minh")
        while True:
            now = datetime.now(tz)
            if now.hour == STOP_HOUR:
                print(f"[STOP] {STOP_HOUR}h VN — tự động kết thúc job.")
                os._exit(0)
            time.sleep(60)


    @events.test_start.add_listener
    def on_start(environment, **_):
        threading.Thread(target=monitor, daemon=True).start()
        threading.Thread(target=stop_at_target_hour, daemon=True).start()

    @events.test_stop.add_listener
    def on_stop(environment, **_):
        print("[CLEANUP] Test stopped. Workers remain connected and ready for next run.")
