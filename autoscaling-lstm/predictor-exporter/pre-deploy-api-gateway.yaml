apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    app: predictor-exporter
    service: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictor-exporter
      service: api-gateway
  template:
    metadata:
      labels:
        app: predictor-exporter
        service: api-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m03
      containers:
        - name: predictor-exporter
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export PYTHONUNBUFFERED=1
              export PIP_DISABLE_PIP_VERSION_CHECK=1
              pip install --no-cache-dir prometheus_client requests
              echo "[EXPORTER] Dependencies installed, starting exporter..."
              exec python /app/predictor_exporter.py
          env:
            - name: PROM_URL
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
            - name: MODEL_ENDPOINT
              value: "http://lstm-serving.model.svc.cluster.local:8080/predict"
            - name: EXPORT_PORT
              value: "9101"

            # Align timestep with training (silver asfreq=1min)
            - name: INTERVAL_SECONDS
              value: "60"

            # Prometheus API timeout
            - name: PROM_TIMEOUT_SECONDS
              value: "5"
            - name: MODEL_TIMEOUT_SECONDS
              value: "10"

            - name: TARGET_RPS_PER_POD
              value: "175"
            - name: APP_JOB
              value: "api-gateway"
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: WINDOW_SIZE
              value: "10"
            - name: TIMEZONE
              value: "Asia/Ho_Chi_Minh"

            - name: APPS_NAMESPACE
              value: "apps"
            - name: MEM_LIMIT_BYTES
              value: "1073741824"
          ports:
            - containerPort: 9101
              name: http-metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: predictor-exporter-script
              mountPath: /app/predictor_exporter.py
              subPath: predictor_exporter.py
      volumes:
        - name: predictor-exporter-script
          configMap:
            name: predictor-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    app: predictor-exporter
    service: api-gateway
    release: kube-prometheus
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9101
      targetPort: 9101
  selector:
    app: predictor-exporter
    service: api-gateway
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    release: kube-prometheus
spec:
  # job label = service (api-gateway), dễ query + tránh job trùng
  jobLabel: service
  namespaceSelector:
    matchNames:
      - model
  selector:
    matchLabels:
      app: predictor-exporter
      service: api-gateway
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 5s

      # chỉ lưu 4 metric lstm_*
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'lstm_(pred_rps|pred_cpu|pred_mem|desired_replicas)'
          action: keep

      # chặn trường hợp exporter lỡ export nhiều metric
      sampleLimit: 20