apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    app: predictor-exporter
    service: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictor-exporter
      service: api-gateway
  template:
    metadata:
      labels:
        app: predictor-exporter
        service: api-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m03
      containers:
        - name: predictor-exporter
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              pip install --no-cache-dir prometheus_client requests
              echo "[EXPORTER] Dependencies installed, starting exporter..."
              exec python /app/predictor_exporter.py
          env:
            - name: PROM_URL
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
            - name: MODEL_ENDPOINT
              value: "http://lstm-serving.model.svc.cluster.local:8080/predict"
            - name: EXPORT_PORT
              value: "9101"
            - name: INTERVAL_SECONDS
              value: "5"
            - name: TARGET_RPS_PER_POD
              value: "400"
            - name: APP_JOB
              value: "api-gateway"
          ports:
            - containerPort: 9101
              name: http-metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: predictor-exporter-script
              mountPath: /app/predictor_exporter.py
              subPath: predictor_exporter.py
      volumes:
        - name: predictor-exporter-script
          configMap:
            name: predictor-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    app: predictor-exporter
    service: api-gateway
    release: kube-prometheus   # <-- BẮT BUỘC PHẢI CÓ
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9101
      targetPort: 9101
  selector:
    app: predictor-exporter
    service: api-gateway
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: predictor-exporter-api-gateway
  namespace: model
  labels:
    release: kube-prometheus      # <-- MATCH Prometheus Selector
spec:
  jobLabel: app
  namespaceSelector:
    matchNames:
      - model
  selector:
    matchLabels:
      app: predictor-exporter
      service: api-gateway
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
