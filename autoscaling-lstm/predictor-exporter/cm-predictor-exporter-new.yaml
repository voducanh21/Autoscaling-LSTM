apiVersion: v1
kind: ConfigMap
metadata:
  name: predictor-exporter-script
  namespace: model
data:
  predictor_exporter.py: |
    import os
    import time
    import math
    import requests
    from math import ceil
    from collections import deque
    from prometheus_client import start_http_server, Gauge, CollectorRegistry

    # === TIMEZONE (match training/silver: Asia/Ho_Chi_Minh) ===
    from datetime import datetime
    from zoneinfo import ZoneInfo

    TZ_NAME = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")
    try:
        TZ = ZoneInfo(TZ_NAME)
    except Exception:
        TZ = None  # fallback

    # === ENV CONFIG ===
    PROM_URL = os.getenv("PROM_URL", "http://prometheus-operated.monitoring.svc.cluster.local:9090").rstrip("/")
    MODEL_ENDPOINT = os.getenv("MODEL_ENDPOINT", "http://lstm-serving.model.svc.cluster.local:8080/predict")
    EXPORT_PORT = int(os.getenv("EXPORT_PORT", "9101"))
    INTERVAL = int(os.getenv("INTERVAL_SECONDS", "60"))
    TARGET_RPS_PER_POD = float(os.getenv("TARGET_RPS_PER_POD", "400"))
    APP_JOB = os.getenv("APP_JOB", "api-gateway")

    PROM_TIMEOUT = float(os.getenv("PROM_TIMEOUT_SECONDS", "5"))
    MODEL_TIMEOUT = float(os.getenv("MODEL_TIMEOUT_SECONDS", "10"))

    # MUST match training window size
    WINDOW_SIZE = int(os.getenv("WINDOW_SIZE", "10"))

    # allow override; default to APP_JOB
    SERVICE_NAME = os.getenv("SERVICE_NAME", APP_JOB)

    # ===== SERVICE → ID (MUST match train) =====
    SERVICE_TO_ID = {
        "api-gateway": 0,
        "authentication-service": 1,
        "order-service": 2,
        "payment-service": 3,
        "product-service": 4,
    }
    if SERVICE_NAME not in SERVICE_TO_ID:
        raise ValueError(f"Unknown SERVICE_NAME={SERVICE_NAME} not in SERVICE_TO_ID")

    SERVICE_ID = SERVICE_TO_ID[SERVICE_NAME]

    # ===== CPU / MEM LIMIT (same as silver) =====
    CPU_LIMIT_MAP = {
        "api-gateway": 1.0,
        "authentication-service": 0.5,
        "order-service": 0.5,
        "payment-service": 0.5,
        "product-service": 1.0,
    }
    MEM_LIMIT_BYTES = float(os.getenv("MEM_LIMIT_BYTES", "1073741824"))  # 1GiB
    APPS_NAMESPACE = os.getenv("APPS_NAMESPACE", "apps")

    # === MODEL INPUT (MUST match train final_input_cols) ===
    FEATURE_COUNT = 13
    buffer = deque(maxlen=WINDOW_SIZE)

    # =========================================================
    # PROMETHEUS EXPORT: ONLY export lstm_* (no python/process_*)
    # =========================================================
    REGISTRY = CollectorRegistry()
    g_pred_rps = Gauge("lstm_pred_rps", "Predicted RPS for next window", registry=REGISTRY)
    g_pred_cpu = Gauge("lstm_pred_cpu", "Predicted CPU (norm) for next window", registry=REGISTRY)
    g_pred_mem = Gauge("lstm_pred_mem", "Predicted Memory (norm) for next window", registry=REGISTRY)
    g_desired_replicas = Gauge("lstm_desired_replicas", "Desired replicas from LSTM forecast", registry=REGISTRY)

    # Reuse HTTP connections (lower overhead)
    SESSION = requests.Session()

    # -------------------------------
    # SAFETY: never export negative/NaN/Inf predictions
    # -------------------------------
    def sanitize_nonneg(x, name="value") -> float:
        try:
            v = float(x)
            if math.isnan(v) or math.isinf(v):
                return 0.0
            if v < 0.0:
                return 0.0
            return v
        except Exception:
            return 0.0

    def prom_query_raw(query: str):
        """
        /api/v1/query -> returns list of result entries (vector)
        """
        try:
            r = SESSION.get(
                f"{PROM_URL}/api/v1/query",
                params={"query": query},
                timeout=PROM_TIMEOUT,
            )
            r.raise_for_status()
            data = r.json()
            if data.get("status") == "success":
                return data.get("data", {}).get("result", []) or []
        except Exception as e:
            print(f"[PROM] query failed: {query} -> {e}")
        return []

    def prom_query_scalar(query: str) -> float:
        """
        Return first scalar in vector response
        """
        res = prom_query_raw(query)
        try:
            if res:
                return float(res[0]["value"][1])
        except Exception:
            pass
        return 0.0

    def prom_query_by_name(query: str) -> dict:
        """
        Map __name__ -> value from vector response.
        Works well with queries like:
          {__name__=~"a|b", ...}
          sum by(__name__) (...)
        """
        out = {}
        res = prom_query_raw(query)
        for item in res:
            try:
                name = item.get("metric", {}).get("__name__")
                if not name:
                    continue
                out[name] = float(item["value"][1])
            except Exception:
                continue
        return out

    def log1p_clip(x: float) -> float:
        if x < 0:
            x = 0.0
        return float(math.log1p(x))

    def get_replica_count(offset: str = "") -> float:
        # count number of pods that have cpu series
        # offset example: " offset 1m"
        q = f'count(pod:cpu:usage1m{{namespace="{APPS_NAMESPACE}",pod=~"{APP_JOB}-.*"}}{offset})'
        n = prom_query_scalar(q)
        if n < 1.0:
            return 1.0
        return n

    def get_current_features():
        # --- Service-level metrics: fetch in 1 query ---
        q_svc = (
            f'{{__name__=~"svc:qps:rate1m|svc:latency_p95_ms|'
            f'svc:rps_roll_mean_5m|svc:rps_roll_mean_15m|svc:rps_lag_1m",'
            f'job="{APP_JOB}"}}'
        )
        svc = prom_query_by_name(q_svc)
        rps_1m = float(svc.get("svc:qps:rate1m", 0.0))
        latency_ms = float(svc.get("svc:latency_p95_ms", 0.0))
        rps_roll_5m = float(svc.get("svc:rps_roll_mean_5m", 0.0))
        rps_roll_15m = float(svc.get("svc:rps_roll_mean_15m", 0.0))
        rps_lag_1m = float(svc.get("svc:rps_lag_1m", 0.0))

        # --- Replica count (now & lag) ---
        replicas_now = get_replica_count(offset="")
        replicas_lag = get_replica_count(offset=" offset 1m")

        # --- CPU/MEM raw current (SUM across replicas): fetch in 1 query ---
        q_sum_now = (
            f'sum by(__name__) ({{__name__=~"pod:cpu:usage1m|pod:mem:usage",'
            f'namespace="{APPS_NAMESPACE}",pod=~"{APP_JOB}-.*"}})'
        )
        sums_now = prom_query_by_name(q_sum_now)
        raw_cpu_sum = float(sums_now.get("pod:cpu:usage1m", 0.0))
        raw_mem_sum = float(sums_now.get("pod:mem:usage", 0.0))

        # --- CPU/MEM raw lag 1m (SUM across replicas): fetch in 1 query ---
        q_sum_lag = (
            f'sum by(__name__) ({{__name__=~"pod:cpu:usage1m|pod:mem:usage",'
            f'namespace="{APPS_NAMESPACE}",pod=~"{APP_JOB}-.*"}} offset 1m)'
        )
        sums_lag = prom_query_by_name(q_sum_lag)
        raw_cpu_lag_sum = float(sums_lag.get("pod:cpu:usage1m", 0.0))
        raw_mem_lag_sum = float(sums_lag.get("pod:mem:usage", 0.0))

        # --- Convert SUM -> AVG per replica (match training when replicas=1) ---
        raw_cpu = raw_cpu_sum / replicas_now
        raw_mem = raw_mem_sum / replicas_now
        raw_cpu_lag = raw_cpu_lag_sum / replicas_lag
        raw_mem_lag = raw_mem_lag_sum / replicas_lag

        cpu_limit = CPU_LIMIT_MAP.get(SERVICE_NAME, 1.0)
        cpu_norm = (raw_cpu / cpu_limit) if cpu_limit > 0 else 0.0
        mem_norm = (raw_mem / MEM_LIMIT_BYTES) if MEM_LIMIT_BYTES > 0 else 0.0

        cpu_lag_1m = (raw_cpu_lag / cpu_limit) if cpu_limit > 0 else cpu_norm
        mem_lag_1m = (raw_mem_lag / MEM_LIMIT_BYTES) if MEM_LIMIT_BYTES > 0 else mem_norm

        # --- Time cyclical encoding (timezone-aligned) ---
        if TZ is not None:
            now = datetime.now(TZ)
            hour = float(now.hour)        # 0..23
            dow  = float(now.weekday())   # 0..6 (Mon=0)
        else:
            now = time.localtime()
            hour = float(now.tm_hour)
            dow  = float(now.tm_wday)

        hour_sin = math.sin(2.0 * math.pi * hour / 24.0)
        hour_cos = math.cos(2.0 * math.pi * hour / 24.0)
        dow_sin  = math.sin(2.0 * math.pi * dow  / 7.0)
        dow_cos  = math.cos(2.0 * math.pi * dow  / 7.0)

        # --- Apply log1p transforms ---
        rps_1m_log1p = log1p_clip(rps_1m)
        latency_log1p = log1p_clip(latency_ms)
        rps_roll_5m_log1p = log1p_clip(rps_roll_5m)
        rps_roll_15m_log1p = log1p_clip(rps_roll_15m)
        rps_lag_1m_log1p = log1p_clip(rps_lag_1m)

        features = [
            rps_1m_log1p,
            latency_log1p,
            float(cpu_norm),
            float(mem_norm),
            rps_roll_5m_log1p,
            rps_roll_15m_log1p,
            rps_lag_1m_log1p,
            float(cpu_lag_1m),
            float(mem_lag_1m),
            float(hour_sin),
            float(hour_cos),
            float(dow_sin),
            float(dow_cos),
        ]

        obs = {
            "rps_raw": rps_1m,
            "lat_raw_ms": latency_ms,
            "cpu_norm": cpu_norm,
            "mem_norm": mem_norm,
            "replicas_now": replicas_now,
        }

        return features, obs

    def call_model(window, service_ids_1xW):
        payload = {"timeseries": [window], "service_id": [service_ids_1xW]}
        try:
            r = SESSION.post(MODEL_ENDPOINT, json=payload, timeout=MODEL_TIMEOUT)
            r.raise_for_status()
            data = r.json()

            # sanitize: never negative/NaN/Inf
            rps_future = sanitize_nonneg(data.get("rps_future", 0.0), "rps_future")
            cpu_future = sanitize_nonneg(data.get("cpu_future", 0.0), "cpu_future")
            mem_future = sanitize_nonneg(data.get("mem_future", 0.0), "mem_future")

            return (rps_future, cpu_future, mem_future)
        except Exception as e:
            print(f"[MODEL] call failed: {e}")
        return (0.0, 0.0, 0.0)

    def loop():
        while True:
            feats, obs = get_current_features()

            if len(feats) != FEATURE_COUNT:
                print(f"[WARN] Feature length mismatch: {len(feats)} (expected {FEATURE_COUNT})")
                time.sleep(INTERVAL)
                continue

            buffer.append(feats)

            if len(buffer) < WINDOW_SIZE:
                print(f"[EXPORTER] Warming up {len(buffer)}/{WINDOW_SIZE} steps...")
                time.sleep(INTERVAL)
                continue

            window = list(buffer)
            service_ids = [SERVICE_ID] * WINDOW_SIZE

            pred_rps, pred_cpu, pred_mem = call_model(window, service_ids)

            pred_rps = sanitize_nonneg(pred_rps, "pred_rps")
            pred_cpu = sanitize_nonneg(pred_cpu, "pred_cpu")
            pred_mem = sanitize_nonneg(pred_mem, "pred_mem")

            desired = max(1, ceil(pred_rps / TARGET_RPS_PER_POD))

            g_pred_rps.set(pred_rps)
            g_pred_cpu.set(pred_cpu)
            g_pred_mem.set(pred_mem)
            g_desired_replicas.set(desired)

            print(
                f"[EXPORTER] replicas={obs['replicas_now']:.0f} | "
                f"OBS(raw)-> rps={obs['rps_raw']:.2f}, lat_ms={obs['lat_raw_ms']:.2f}, "
                f"cpu_norm={obs['cpu_norm']:.4f}, mem_norm={obs['mem_norm']:.4f} | "
                f"PRED-> rps={pred_rps:.4f}, cpu={pred_cpu:.4f}, mem={pred_mem:.4f} | desired={desired}"
            )

            time.sleep(INTERVAL)

    if __name__ == "__main__":
        print(f"[EXPORTER] Predictor Exporter starting at port {EXPORT_PORT}")
        print(f"[INFO] PROM_URL={PROM_URL}")
        print(f"[INFO] MODEL_ENDPOINT={MODEL_ENDPOINT}")
        print(f"[INFO] APP_JOB={APP_JOB}")
        print(f"[INFO] SERVICE_NAME={SERVICE_NAME}, SERVICE_ID={SERVICE_ID}")
        print(f"[INFO] WINDOW_SIZE={WINDOW_SIZE}, FEATURE_COUNT={FEATURE_COUNT}")
        print(f"[INFO] TARGET_RPS_PER_POD={TARGET_RPS_PER_POD}")
        print(f"[INFO] TIMEZONE={TZ_NAME}")
        print(f"[INFO] INTERVAL_SECONDS={INTERVAL}")
        start_http_server(EXPORT_PORT, registry=REGISTRY)
        loop()