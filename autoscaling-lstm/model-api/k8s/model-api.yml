---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
  namespace: apps
  labels:
    app.kubernetes.io/name: model-api
    app: model-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-api
        app: model-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: model-api
          image: ducanhvo/autoscaling-model-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: MODEL_PATH
              value: /models/lstm_ts.pt
            - name: SCALER_PATH
              value: /models/scaler.json
            - name: DEFAULT_HORIZON_SECONDS
              value: "600"
            - name: STEP_SECONDS
              value: "60"
            - name: TORCH_NUM_THREADS
              value: "1"
            - name: TORCH_NUM_INTEROP_THREADS
              value: "1"
          volumeMounts:
            - name: data-pvc
              mountPath: /models
              subPath: models   # mount đúng thư mục con “models” trên PVC
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data-pvc
          persistentVolumeClaim:
            claimName: metrics-data-pvc

---
# Service cho ứng dụng (exporter gọi /predict qua service này)
apiVersion: v1
kind: Service
metadata:
  name: model-api
  namespace: apps
  labels:
    app.kubernetes.io/name: model-api
    app: model-api
spec:
  selector:
    app: model-api
  ports:
    - name: http
      port: 9000
      targetPort: http
  type: ClusterIP

---
# Service dành cho Prometheus scrape (gán nhãn riêng để ServiceMonitor chọn)
apiVersion: v1
kind: Service
metadata:
  name: model-api-metrics
  namespace: apps
  labels:
    app.kubernetes.io/name: model-api
    app: model-api
    metrics: "true"        # ServiceMonitor sẽ match label này
spec:
  selector:
    app: model-api
  ports:
    - name: metrics
      port: 9000
      targetPort: http
  type: ClusterIP

---
# ServiceMonitor (Prometheus Operator) scrape /metrics cổng 9000
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: model-api
  namespace: apps
  labels:
    release: monitoring-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      metrics: "true"                # chọn đúng service "model-api-metrics"
  namespaceSelector:
    matchNames: ["apps"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
