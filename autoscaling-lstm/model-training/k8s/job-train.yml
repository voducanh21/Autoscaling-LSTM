apiVersion: batch/v1
kind: Job
metadata:
  name: lstm-train
  namespace: apps
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data-pvc
          persistentVolumeClaim:
            claimName: metrics-data-pvc     # PVC chứa CSV
      initContainers:
        - name: ensure-folders
          image: busybox:1.36
          command: ["sh","-lc","mkdir -p /data/models"]
          volumeMounts:
            - name: data-pvc
              mountPath: /data
      containers:
        - name: trainer
          image: ducanhvo/autoscaling-trainer:latest
          imagePullPolicy: Always
          command: ["python", "train_lstm.py"]     # <- thêm dòng này
          args:
            - --data_glob
            - /data/*.csv
            - --outdir
            - /data/models
          volumeMounts:
            - name: data-pvc
              mountPath: /data
