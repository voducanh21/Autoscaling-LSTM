apiVersion: v1
kind: ConfigMap
metadata:
  name: lstm-code
  namespace: model
data:
  main.py: |
    import os
    import mlflow
    import mlflow.pyfunc
    from fastapi import FastAPI, HTTPException
    import numpy as np
    import traceback

    app = FastAPI(title="LSTM Forecast Serving API")

    # === ENV ===
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI")
    MLFLOW_S3_ENDPOINT_URL = os.getenv("MLFLOW_S3_ENDPOINT_URL")
    MODEL_URI = os.getenv("MODEL_URI")
    MODEL_NAME = os.getenv("MODEL_NAME", "lstm_forecast")

    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
    os.environ["MLFLOW_S3_ENDPOINT_URL"] = MLFLOW_S3_ENDPOINT_URL
    os.environ["AWS_S3_ADDRESSING_STYLE"] = "path"

    if not MODEL_URI:
        MODEL_URI = f"models:/{MODEL_NAME}/Production"

    print(f"[SERVING] Loading model from URI={MODEL_URI}")

    try:
        model = mlflow.pyfunc.load_model(MODEL_URI)
        print("[SERVING] Model loaded OK")
    except Exception as e:
        raise RuntimeError(f"Cannot load model: {e}")

    @app.get("/")
    def root():
        return {"message": f"LSTM Serving Running (model={MODEL_URI})"}

    @app.post("/predict")
    def predict(data: dict):
        try:
            ts = data.get("timeseries")
            # model expects 'service_id', fallback to service_ids
            svc = data.get("service_id") or data.get("service_ids")

            if ts is None or svc is None:
                raise ValueError("Missing 'timeseries' or 'service_id'")

            ts_arr = np.array(ts, dtype=np.float32)   # (1,30,23)
            svc_arr = np.array(svc, dtype=np.int32)   # (1,30)

            # shape validations
            if ts_arr.ndim != 3 or ts_arr.shape[2] != 23:
                raise ValueError(f"timeseries shape must be (1,30,23), got {ts_arr.shape}")

            if svc_arr.shape != (ts_arr.shape[0], ts_arr.shape[1]):
                raise ValueError(f"service_id shape must be (1,30), got {svc_arr.shape}")

            preds = model.predict({
                "timeseries": ts_arr,
                "service_id": svc_arr
            })

            preds = np.array(preds).flatten().tolist()

            return {
                "rps_future": preds[0],
                "cpu_future": preds[1],
                "mem_future": preds[2],
                "predictions": preds
            }

        except Exception as e:
            traceback.print_exc()
            raise HTTPException(status_code=500, detail=str(e))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lstm-serving
  namespace: model
  labels:
    app: lstm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lstm-serving
  template:
    metadata:
      labels:
        app: lstm-serving
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m03
      containers:
        - name: lstm-serving
          image: ducanhvo/lstm-serving:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlflow.svc.cluster.local:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://minio.voducanh.id.vn"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"
            - name: MODEL_NAME
              value: "lstm_forecast"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_SECRET_ACCESS_KEY
            - name: MODEL_URI
              valueFrom:
                configMapKeyRef:
                  name: lstm-config
                  key: MODEL_URI
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: lstm-code
              mountPath: /app/main.py
              subPath: main.py
      volumes:
        - name: lstm-code
          configMap:
            name: lstm-code
---
apiVersion: v1
kind: Service
metadata:
  name: lstm-serving
  namespace: model
  labels:
    app: lstm-serving
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lstm-serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lstm-config
  namespace: model
data:
  MODEL_URI: "models:/lstm_forecast/Production"
