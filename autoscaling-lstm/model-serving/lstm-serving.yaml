apiVersion: v1
kind: ConfigMap
metadata:
  name: lstm-code
  namespace: model
data:
  main.py: |
    import os
    import traceback
    import numpy as np

    import mlflow
    import mlflow.keras
    from fastapi import FastAPI, HTTPException

    app = FastAPI(title="LSTM Forecast Serving API")

    # ================= ENV =================
    MLFLOW_TRACKING_URI = os.getenv(
        "MLFLOW_TRACKING_URI",
        "http://mlflow.mlflow.svc.cluster.local:5000"
    )

    # Will be patched by register_model.py via ConfigMap lstm-config (key: MODEL_URI)
    MODEL_URI = os.getenv("MODEL_URI", "models:/lstm_forecast/Production")

    # MUST match training
    FEATURE_COUNT = int(os.getenv("FEATURE_COUNT", "13"))
    WINDOW_SIZE = int(os.getenv("WINDOW_SIZE", "10"))

    # MUST match training label transform
    TARGET_RPS_LOG1P = os.getenv("TARGET_RPS_LOG1P", "true").lower() == "true"

    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)

    def inv_rps_transform(x: np.ndarray) -> np.ndarray:
        x = np.asarray(x, dtype=np.float64)
        if not TARGET_RPS_LOG1P:
            return x.astype(np.float32)
        y = np.expm1(x)
        y = np.clip(y, 0.0, None)
        return y.astype(np.float32)

    # ================= LOAD MODEL =================
    try:
        model = mlflow.keras.load_model(MODEL_URI)
        print(f"[SERVING] Loaded model from {MODEL_URI}")
    except Exception as e:
        raise RuntimeError(f"Cannot load model: {e}")

    @app.get("/")
    def root():
        return {"status": "ok", "model_uri": MODEL_URI}

    @app.post("/predict")
    def predict(payload: dict):
        """
        Expected payload:
        {
          "timeseries": [[[...FEATURE_COUNT...], ...]],   # (B, T, FEATURE_COUNT)
          "service_id": [[0,0,0,...]]                     # (B, T)
        }
        """
        try:
            X = np.asarray(payload.get("timeseries"), dtype=np.float32)
            S = np.asarray(payload.get("service_id"), dtype=np.int32)

            if X.ndim != 3 or X.shape[2] != FEATURE_COUNT:
                raise ValueError(
                    f"timeseries must be (B, T, {FEATURE_COUNT}), got {X.shape}"
                )

            if X.shape[1] != WINDOW_SIZE:
                raise ValueError(
                    f"T must equal WINDOW_SIZE={WINDOW_SIZE}, got T={X.shape[1]}"
                )

            if S.ndim != 2 or S.shape[0] != X.shape[0] or S.shape[1] != X.shape[1]:
                raise ValueError(
                    f"service_id must be (B, T) and match timeseries, got {S.shape}"
                )

            y = model.predict([X, S], verbose=0)  # (B, 3)
            if y.ndim != 2 or y.shape[1] != 3:
                raise ValueError(f"model output must be (B, 3), got {y.shape}")

            # Inverse transform for RPS only (if TARGET_RPS_LOG1P=true)
            rps = inv_rps_transform(y[:, 0])
            cpu = y[:, 1].astype(np.float32)
            mem = y[:, 2].astype(np.float32)

            results = []
            for i in range(y.shape[0]):
                results.append({
                    "rps_future": float(rps[i]),
                    "cpu_future": float(cpu[i]),
                    "mem_future": float(mem[i]),
                })

            # Backward-friendly: if batch=1, also return top-level scalars
            if len(results) == 1:
                return {
                    "rps_future": results[0]["rps_future"],
                    "cpu_future": results[0]["cpu_future"],
                    "mem_future": results[0]["mem_future"],
                    "predictions": results,
                }

            return {"predictions": results}

        except Exception as e:
            traceback.print_exc()
            raise HTTPException(status_code=500, detail=str(e))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lstm-serving
  namespace: model
  labels:
    app: lstm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lstm-serving
  template:
    metadata:
      labels:
        app: lstm-serving
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m03
      containers:
        - name: lstm-serving
          image: ducanhvo/cnn-lstm-serving:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlflow.svc.cluster.local:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://minio.voducanh.id.vn"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"

            # Match training assumptions
            - name: FEATURE_COUNT
              value: "13"
            - name: WINDOW_SIZE
              value: "10"
            - name: TARGET_RPS_LOG1P
              value: "true"

            # Optional metadata
            - name: MODEL_NAME
              value: "lstm_forecast"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_SECRET_ACCESS_KEY

            # Patched by register_model.py (ConfigMap: lstm-config / key: MODEL_URI)
            - name: MODEL_URI
              valueFrom:
                configMapKeyRef:
                  name: lstm-config
                  key: MODEL_URI

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: lstm-code
              mountPath: /app/main.py
              subPath: main.py

      volumes:
        - name: lstm-code
          configMap:
            name: lstm-code
---
apiVersion: v1
kind: Service
metadata:
  name: lstm-serving
  namespace: model
  labels:
    app: lstm-serving
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lstm-serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lstm-config
  namespace: model
data:
  MODEL_URI: "models:/lstm_forecast/Production"
