apiVersion: v1
kind: ConfigMap
metadata:
  name: cnn-lstm-code
  namespace: model
data:
  main.py: |
    import os
    import mlflow
    import mlflow.keras
    from fastapi import FastAPI, HTTPException
    import numpy as np
    import traceback

    app = FastAPI(title="CNN+LSTM Forecast Serving API")

    # ================= ENV =================
    MLFLOW_TRACKING_URI = os.getenv(
        "MLFLOW_TRACKING_URI",
        "http://mlflow.mlflow.svc.cluster.local:5000"
    )

    # Default points to your CNN+LSTM registered model
    MODEL_URI = os.getenv("MODEL_URI", "models:/cnn_lstm_forecast/Production")

    # MUST match training input feature count (your train script uses 13 input_cols)
    FEATURE_COUNT = int(os.getenv("FEATURE_COUNT", "13"))

    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)

    # ================= LOAD MODEL =================
    try:
        model = mlflow.keras.load_model(MODEL_URI)
        print(f"[SERVING] Loaded model from {MODEL_URI}")
    except Exception as e:
        raise RuntimeError(f"Cannot load model: {e}")

    @app.get("/")
    def root():
        return {"status": "ok", "model_uri": MODEL_URI}

    @app.post("/predict")
    def predict(payload: dict):
        """
        Expected payload:
        {
          "timeseries": [[[...13 features...], ...]],   # (B, T, 13)
          "service_id": [[0,0,0,...]]                   # (B, T)
        }
        """
        try:
            X = np.asarray(payload.get("timeseries"), dtype=np.float32)
            S = np.asarray(payload.get("service_id"), dtype=np.int32)

            if X.ndim != 3 or X.shape[2] != FEATURE_COUNT:
                raise ValueError(
                    f"timeseries must be (B, T, {FEATURE_COUNT}), got {X.shape}"
                )

            if S.ndim != 2 or S.shape[0] != X.shape[0] or S.shape[1] != X.shape[1]:
                raise ValueError(
                    f"service_id must be (B, T) and match timeseries, got {S.shape}"
                )

            preds = model.predict([X, S], verbose=0)
            preds = np.asarray(preds, dtype=np.float32).reshape(-1).tolist()

            # model output is [rps_future, cpu_future, mem_future]
            return {
                "rps_future": float(preds[0]),
                "cpu_future": float(preds[1]),
                "mem_future": float(preds[2]),
                "predictions": preds
            }

        except Exception as e:
            traceback.print_exc()
            raise HTTPException(status_code=500, detail=str(e))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnn-lstm-serving
  namespace: model
  labels:
    app: cnn-lstm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnn-lstm-serving
  template:
    metadata:
      labels:
        app: cnn-lstm-serving
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m03
      containers:
        - name: cnn-lstm-serving
          image: ducanhvo/lstm-serving:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlflow.svc.cluster.local:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "https://minio.voducanh.id.vn"
            - name: AWS_S3_ADDRESSING_STYLE
              value: "path"

            # optional metadata
            - name: MODEL_NAME
              value: "cnn_lstm_forecast"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: AWS_SECRET_ACCESS_KEY

            - name: MODEL_URI
              valueFrom:
                configMapKeyRef:
                  name: cnn-lstm-config
                  key: MODEL_URI

            # must match training input feature count
            - name: FEATURE_COUNT
              value: "13"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: cnn-lstm-code
              mountPath: /app/main.py
              subPath: main.py
      volumes:
        - name: cnn-lstm-code
          configMap:
            name: cnn-lstm-code
---
apiVersion: v1
kind: Service
metadata:
  name: cnn-lstm-serving
  namespace: model
  labels:
    app: cnn-lstm-serving
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: cnn-lstm-serving
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnn-lstm-config
  namespace: model
data:
  MODEL_URI: "models:/cnn_lstm_forecast/Production"
