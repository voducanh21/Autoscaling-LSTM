# scaledobject-api-gateway.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-gateway-forecast
  namespace: apps
spec:
  scaleTargetRef:
    name: api-gateway
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 30
  advanced:
    restoreToOriginalReplicaCount: false
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
        metricName: forecast_desired_replicas
        query: forecast_desired_replicas{deployment="api-gateway"}
        threshold: "1"   # mỗi 1 “đơn vị” = 1 replica mong muốn
      # fallback (tùy chọn): nếu Prom lỗi 3 lần liên tiếp → quay về CPU 70%
  fallback:
    failureThreshold: 3
    replicas: 2
