mysql:
  enabled: true

  auth:
    rootPassword: "12345678"
    username: airflow
    password: "12345678"
    database: airflow

  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 800m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi

nfs:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard

  storageClass:
    create: true
    name: nfs-rwx
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2
      - timeo=30

airflow:
  defaultAirflowTag: "3.0.6"
  airflowVersion: "3.0.6"

  executor: KubernetesExecutor

  postgresql:
    enabled: false

  workers:
    replicas: 0

  logs:
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: nfs-rwx

  data:
    metadataConnection:
      user: airflow
      pass: "12345678"
      protocol: mysql
      db: airflow
      port: 3306
      host: "airflow-mysql.airflow.svc.cluster.local"

  #########################################################################
  # ✔ SECRET KEY + FERNET KEY – ĐÚNG SCHEMA, KHÔNG LỖI HELM
  #########################################################################

  config:
    core:
      secret_key: "ducanh-super-secret-key-1234567890"
      fernet_key: "qIUz4MTSqUehzQwO7G8v3BdS5ItPlqrQkF5rRprtVsc="
      load_examples: "False"

    api:
      secret_key: "ducanh-super-secret-key-1234567890"

  #########################################################################
  # ✔ GIT SYNC
  #########################################################################

  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
      branch: main
      subPath: "autoscaling-lstm/data-pipeline/dags"
      wait: 30
      credentialsSecret: airflow-git-secret

  #########################################################################
  # ✔ API SERVER – COMMAND CHUẨN AIRFLOW 3.X
  #########################################################################

  api:
    command:
      - "bash"
      - "-c"
      - |
        exec airflow http \
          --host 0.0.0.0 \
          --port 8080

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi

    startupProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 220
      periodSeconds: 10
      failureThreshold: 15
      timeoutSeconds: 10

    livenessProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 180
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5

    readinessProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 150
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
