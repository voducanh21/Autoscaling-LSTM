mysql:
  enabled: true

  auth:
    rootPassword: "12345678"
    username: airflow
    password: "12345678"
    database: airflow

  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: nfs-rwx

nfs:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard

  storageClass:
    create: true
    name: nfs-rwx
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2
      - timeo=30

airflow:
  defaultAirflowTag: "3.0.6"
  airflowVersion: "3.0.6"

  # Disable Celery worker dependencies
  executor: KubernetesExecutor
  postgresql:
    enabled: false
  workers:
    replicas: 0

  logs:
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: nfs-rwx

  data:
    metadataConnection:
      user: airflow
      pass: "12345678"
      protocol: mysql
      db: airflow
      port: 3306
      host: "airflow-mysql.airflow.svc.cluster.local"

  config:
    core:
      load_examples: "True"

  extraEnv: |
    - name: AIRFLOW__CORE__LOAD_EXAMPLES
      value: "True"

  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
      branch: main
      subPath: "autoscaling-lstm/data-pipeline/dags"
      wait: 30
      credentialsSecret: airflow-git-secret

  api:
    startupProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 12
      timeoutSeconds: 10
