mysql:
  enabled: true

  auth:
    rootPassword: "12345678"
    username: airflow
    password: "12345678"
    database: airflow

  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: nfs-rwx
    resources:            # thêm CPU/memory
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1200m
        memory: 1Gi

nfs:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard

  storageClass:
    create: true
    name: nfs-rwx
    defaultClass: false
    mountOptions:
      - vers=4.1
      - retrans=2
      - timeo=30

airflow:
  defaultAirflowTag: "3.0.6"
  airflowVersion: "3.0.6"

  # Disable Celery worker dependencies
  executor: KubernetesExecutor
  postgresql:
    enabled: false
  workers:
    replicas: 0

  logs:
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: nfs-rwx

  data:
    metadataConnection:
      user: airflow
      pass: "12345678"
      protocol: mysql
      db: airflow
      port: 3306
      host: "airflow-mysql.airflow.svc.cluster.local"

  config:
    core:
      load_examples: "False"

  extraEnv: |
    - name: AIRFLOW__CORE__LOAD_EXAMPLES
      value: "False"

  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
      branch: main
      subPath: "autoscaling-lstm/data-pipeline/dags"
      wait: 30
      credentialsSecret: airflow-git-secret

  api:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    startupProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 180
      periodSeconds: 10
      failureThreshold: 15
      timeoutSeconds: 10

    livenessProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 180
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5

    readinessProbe:
      httpGet:
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 150
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5


