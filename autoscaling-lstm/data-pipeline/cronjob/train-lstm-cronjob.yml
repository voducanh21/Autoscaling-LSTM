apiVersion: batch/v1
kind: CronJob
metadata:
  name: train-lstm-cronjob
  namespace: cronjob
spec:
  schedule: "0 */6 * * *"         # chạy mỗi 6 tiếng
  suspend: true                   # disable mặc định
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3n-m03

          containers:
            - name: train-lstm
              image: ducanhvo/train-lstm:latest
              imagePullPolicy: Always
              command: ["python"]
              args: ["/app/train_lstm.py"]

              env:
                # --- S3 / MinIO ---
                - name: S3_ENDPOINT
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_ARTIFACT_ROOT
                  value: "s3://datalake/mlflow"
                - name: MLFLOW_ARTIFACTS_DESTINATION
                  value: "s3://datalake/mlflow"
                - name: S3_BUCKET
                  value: "datalake"
                - name: SILVER_PREFIX
                  value: "silver/metrics"
                - name: AWS_S3_ADDRESSING_STYLE
                  value: "path"

                # --- MLflow ---
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.mlflow.svc.cluster.local:5000"

                # --- Training Params ---
                - name: TARGET
                  value: "rps_1m"
                - name: WINDOW_SIZE
                  value: "30"
                - name: EPOCHS
                  value: "20"
                - name: BATCH_SIZE
                  value: "128"

                # --- MINIO credentials ---
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_SECRET_ACCESS_KEY

              volumeMounts:
                - name: train-lstm-script
                  mountPath: /app
                  readOnly: true

          volumes:
            - name: train-lstm-script
              configMap:
                name: train-lstm-script
