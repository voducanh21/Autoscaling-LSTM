apiVersion: batch/v1
kind: CronJob
metadata:
  name: silver-metrics-cronjob
  namespace: cronjob
spec:
  schedule: "*/10 * * * *"
  suspend: true                      # bật lại nếu muốn chạy
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: silver-metrics
              image: python:3.11-slim
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-lc"]
              args:
                - >
                  pip install -q pandas pyarrow fsspec s3fs tzdata &&
                  python /app/silver_builder.py
              env:
                - name: S3_BUCKET
                  value: "datalake"
                - name: BRONZE_PREFIX
                  value: "bronze/metrics"
                - name: SILVER_PREFIX
                  value: "silver/metrics"
                - name: S3_ENDPOINT
                  value: "https://minio.voducanh.id.vn"   # ✅ qua Cloudflare HTTPS
                - name: AWS_S3_ADDRESSING_STYLE
                  value: "path"                            # ✅ ép path-style
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_SECRET_ACCESS_KEY
                - name: TIMEZONE
                  value: "Asia/Ho_Chi_Minh"
              volumeMounts:
                - name: silver-script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: silver-script
              configMap:
                name: silver-metrics-script
