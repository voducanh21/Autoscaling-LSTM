apiVersion: batch/v1
kind: CronJob
metadata:
  name: train-lstm-cronjob-no-p95
  namespace: cronjob
spec:
  schedule: "0 */6 * * *"         # chạy mỗi 6 tiếng
  suspend: true                   # disable mặc định
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3n-m03

          # dùng SA có quyền patch ConfigMap + restart Deployment
          serviceAccountName: register-model-sa

          containers:
            - name: train-lstm
              image: ducanhvo/train-lstm:latest
              imagePullPolicy: Always

              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  echo "[INFO] Start training LSTM (no p95)..."
                  python /app/train_lstm.py
                  echo "[INFO] Training done. Running model registry..."
                  python /register/register_model.py
                  echo "[INFO] Registry done."

              env:
                # --- S3 / MinIO ---
                - name: S3_ENDPOINT
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_ARTIFACT_ROOT
                  value: "s3://datalake/mlflow"
                - name: MLFLOW_ARTIFACTS_DESTINATION
                  value: "s3://datalake/mlflow"
                - name: S3_BUCKET
                  value: "datalake"
                - name: SILVER_PREFIX
                  value: "silver/metrics"
                - name: AWS_S3_ADDRESSING_STYLE
                  value: "path"

                # --- MLflow ---
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.mlflow.svc.cluster.local:5000"

                # --- Training Params ---
                - name: WINDOW_SIZE
                  value: "10"
                - name: EPOCHS
                  value: "20"
                - name: BATCH_SIZE
                  value: "128"

                # --- Split (80/10/10) ---
                - name: TRAIN_FRAC
                  value: "0.80"
                - name: VAL_FRAC
                  value: "0.10"
                - name: EXTRA_EMBARGO_MINUTES
                  value: "0"

                # --- FULL DATA MODE ---
                - name: DATE_FRACTION
                  value: "1.0"
                - name: DATE_PICK_MODE
                  value: "all"
                - name: DATE_SEED
                  value: "42"

                # --- Promotion knobs (optional) ---
                - name: REQUIRE_BOTH_RPS_AND_CPU
                  value: "true"
                - name: PROMOTION_EPS
                  value: "0.0"
                - name: REQUIRE_BEAT_BASELINE_TEST_WAPE
                  value: "false"

                # --- MINIO credentials ---
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_SECRET_ACCESS_KEY

                # --- Model / Experiment ---
                - name: MODEL_NAME
                  value: "lstm_forecast_no_p95"
                - name: EXPERIMENT_NAME
                  value: "lstm_forecast_no_p95"

                # Optional: log per-service test MAE RPS
                - name: LOG_TEST_PER_SERVICE
                  value: "true"

              volumeMounts:
                - name: train-lstm-script-no-p95
                  mountPath: /app
                  readOnly: true

                - name: register-model-script
                  mountPath: /register
                  readOnly: true

          volumes:
            - name: train-lstm-script-no-p95
              configMap:
                name: train-lstm-script-no-p95

            - name: register-model-script
              configMap:
                name: register-model-script
