apiVersion: batch/v1
kind: CronJob
metadata:
  name: train-lstm-cronjob
  namespace: cronjob
spec:
  schedule: "0 */6 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k3n-m03
          serviceAccountName: register-model-sa

          containers:
            - name: train-lstm
              image: ducanhvo/train-lstm:latest
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  set -o pipefail

                  echo "[INFO] Start training LSTM..."
                  python /app/train_lstm.py
                  train_rc=$?
                  if [ "$train_rc" -ne 0 ]; then
                    echo "[ERROR] Training failed rc=${train_rc}"
                    exit "$train_rc"
                  fi
                  echo "[INFO] Training done."

                  # Optional: unify tag for reference metadata
                  TAG="$(date -u +%Y%m%dT%H%M%SZ)"
                  export REF_TAG="${TAG}"

                  echo "[INFO] Running model registry..."
                  python /register/register_model.py
                  reg_rc=$?
                  echo "[INFO] Registry exit code=${reg_rc}"

                  # PROMOTED_EXIT_CODE in register_model.py (default 10)
                  if [ "$reg_rc" -eq 10 ]; then
                    echo "[INFO] Model promoted -> saving drift reference (REF_TAG=${REF_TAG})..."
                    python /reference/save_reference.py
                    ref_rc=$?
                    if [ "$ref_rc" -ne 0 ]; then
                      echo "[ERROR] save_reference failed rc=${ref_rc}"
                      exit "$ref_rc"
                    fi
                    echo "[INFO] Reference saved OK."
                    exit 0
                  elif [ "$reg_rc" -eq 0 ]; then
                    echo "[INFO] Not promoted -> skip saving reference."
                    exit 0
                  else
                    echo "[ERROR] Registry failed rc=${reg_rc}"
                    exit "$reg_rc"
                  fi

              env:
                # --- S3 / MinIO ---
                - name: S3_ENDPOINT
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "https://minio.voducanh.id.vn"
                - name: MLFLOW_ARTIFACT_ROOT
                  value: "s3://datalake/mlflow"
                - name: MLFLOW_ARTIFACTS_DESTINATION
                  value: "s3://datalake/mlflow"
                - name: S3_BUCKET
                  value: "datalake"
                - name: SILVER_PREFIX
                  value: "silver/metrics"
                - name: AWS_S3_ADDRESSING_STYLE
                  value: "path"

                # --- Timezone (match train/reference) ---
                - name: TIMEZONE
                  value: "Asia/Ho_Chi_Minh"

                # --- MLflow ---
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.mlflow.svc.cluster.local:5000"

                # --- Training Params ---
                - name: WINDOW_SIZE
                  value: "10"
                - name: EPOCHS
                  value: "20"
                - name: BATCH_SIZE
                  value: "128"
                - name: HORIZON_MINUTES
                  value: "5"

                # --- Split 80/10/10 ---
                - name: TRAIN_FRAC
                  value: "0.80"
                - name: VAL_FRAC
                  value: "0.10"
                - name: EXTRA_EMBARGO_MINUTES
                  value: "0"

                # --- FULL DATA MODE ---
                - name: DATE_FRACTION
                  value: "1.0"
                - name: DATE_PICK_MODE
                  value: "all"
                - name: DATE_SEED
                  value: "42"

                # --- MINIO credentials ---
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-cred
                      key: AWS_SECRET_ACCESS_KEY

                # --- Model / Experiment ---
                - name: MODEL_NAME
                  value: "lstm_forecast"
                - name: EXPERIMENT_NAME
                  value: "lstm_forecast"

                # --- register_model knobs ---
                - name: PROMOTED_EXIT_CODE
                  value: "10"

                # --- save_reference knobs ---
                - name: REF_PREFIX
                  value: "drift/reference"
                - name: REF_PER_SERVICE
                  value: "true"
                - name: SAVE_COMBINED
                  value: "true"
                - name: SAVE_LATEST_POINTER
                  value: "true"
                - name: REF_MAX_ROWS_PER_SERVICE
                  value: "200000"

              volumeMounts:
                - name: train-lstm-script
                  mountPath: /app
                  readOnly: true
                - name: register-model-script
                  mountPath: /register
                  readOnly: true
                - name: drift-reference-script
                  mountPath: /reference
                  readOnly: true

          volumes:
            - name: train-lstm-script
              configMap:
                name: train-lstm-script
            - name: register-model-script
              configMap:
                name: register-model-script
            - name: drift-reference-script
              configMap:
                name: drift-reference-script
