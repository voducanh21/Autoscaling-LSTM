apiVersion: v1
kind: ConfigMap
metadata:
  name: register-model-script
  namespace: cronjob
data:
  register_model.py: |
    import os
    import sys
    import json
    import time
    import math
    import traceback
    from datetime import datetime, timezone

    import mlflow
    from mlflow.tracking import MlflowClient

    # ============================================================
    # ENV
    # ============================================================
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI", "").strip()
    if not MLFLOW_TRACKING_URI:
        print("[ERROR] MLFLOW_TRACKING_URI is required", file=sys.stderr)
        sys.exit(1)

    MODEL_NAME = os.getenv("MODEL_NAME", "lstm_forecast").strip()
    EXPERIMENT_NAME = os.getenv("EXPERIMENT_NAME", MODEL_NAME).strip()

    # Promotion knobs (kept compatible with your CronJob env)
    REQUIRE_BOTH_RPS_AND_CPU = os.getenv("REQUIRE_BOTH_RPS_AND_CPU", "true").lower() == "true"
    REQUIRE_BEAT_BASELINE_TEST_WAPE = os.getenv("REQUIRE_BEAT_BASELINE_TEST_WAPE", "false").lower() == "true"
    PROMOTION_EPS = float(os.getenv("PROMOTION_EPS", "0.0"))

    # Which metrics exist in THIS training script version
    MET_TEST_WAPE_RPS = "test_wape_rps"
    MET_TEST_MAE_CPU  = "test_mae_cpu"
    MET_TEST_MAE_MEM  = "test_mae_mem"
    MET_TEST_P95_ABS_ERR_RPS = "test_p95_abs_err_rps"     # NEW in this version
    MET_IMPROVE_TEST_WAPE_RPS = "improve_test_wape_rps"   # baseline - model
    MET_IMPROVE_TEST_MAE_CPU  = "improve_test_mae_cpu"    # baseline - model
    MET_IMPROVE_TEST_MAE_MEM  = "improve_test_mae_mem"    # baseline - model

    # Registry stage
    TARGET_STAGE = os.getenv("TARGET_STAGE", "Production").strip() or "Production"
    ARCHIVE_OLD = os.getenv("ARCHIVE_OLD", "true").lower() == "true"

    # K8s patch/restart (optional but default on)
    K8S_ENABLE = os.getenv("K8S_ENABLE", "true").lower() == "true"
    K8S_NAMESPACE = os.getenv("K8S_NAMESPACE", "model").strip() or "model"
    SERVING_CONFIGMAP = os.getenv("SERVING_CONFIGMAP", "lstm-serving-config").strip() or "lstm-serving-config"
    RESTART_DEPLOYMENTS = [x.strip() for x in os.getenv("RESTART_DEPLOYMENTS", "lstm-serving").split(",") if x.strip()]

    # If your serving expects a specific key, set it here:
    # - "MODEL_URI" is the safe default.
    CONFIG_KEY_MODEL_URI = os.getenv("CONFIG_KEY_MODEL_URI", "MODEL_URI").strip() or "MODEL_URI"

    # ============================================================
    # MLflow hardening
    # ============================================================
    os.environ.setdefault("MLFLOW_HTTP_REQUEST_MAX_RETRIES", "0")
    os.environ.setdefault("MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR", "0")
    try:
        if hasattr(mlflow, "config") and hasattr(mlflow.config, "enable_async_logging"):
            mlflow.config.enable_async_logging(False)
    except Exception:
        pass

    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
    client = MlflowClient()

    def _now_iso():
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def _to_float(x):
        try:
            if x is None:
                return None
            v = float(x)
            if math.isnan(v) or math.isinf(v):
                return None
            return v
        except Exception:
            return None

    def _pick_best_run(exp_id: str):
        # Pull a reasonable number of recent runs, then select best by metrics
        runs = mlflow.search_runs(
            experiment_ids=[exp_id],
            order_by=["attributes.start_time DESC"],
            max_results=200,
        )
        if runs is None or len(runs) == 0:
            return None, "No runs found"
        
        candidates = []
        for _, r in runs.iterrows():
            run_id = r.get("run_id") or r.get("run_uuid")  # compatibility
            if not run_id:
                continue
            
            # metrics columns come as: metrics.<name>
            m_test_wape = _to_float(r.get(f"metrics.{MET_TEST_WAPE_RPS}"))
            m_cpu_mae   = _to_float(r.get(f"metrics.{MET_TEST_MAE_CPU}"))
            m_mem_mae   = _to_float(r.get(f"metrics.{MET_TEST_MAE_MEM}"))
            m_p95_abs   = _to_float(r.get(f"metrics.{MET_TEST_P95_ABS_ERR_RPS}"))
            m_impr_wape = _to_float(r.get(f"metrics.{MET_IMPROVE_TEST_WAPE_RPS}"))
            m_impr_cpu  = _to_float(r.get(f"metrics.{MET_IMPROVE_TEST_MAE_CPU}"))
            m_impr_mem  = _to_float(r.get(f"metrics.{MET_IMPROVE_TEST_MAE_MEM}"))
            
            # Require core test metrics for selection
            if m_test_wape is None or m_cpu_mae is None or m_mem_mae is None:
                continue
            
            # Promotion gates (optional)
            if REQUIRE_BEAT_BASELINE_TEST_WAPE:
                if (m_impr_wape is None) or (m_impr_wape < PROMOTION_EPS):
                    continue
            
            if REQUIRE_BOTH_RPS_AND_CPU:
                if (m_impr_wape is None) or (m_impr_cpu is None):
                    continue
                if (m_impr_wape < PROMOTION_EPS) or (m_impr_cpu < PROMOTION_EPS):
                    continue
            
            # Score (lower is better)
            # Primary: test_wape_rps, then cpu/mem mae, then (optional) p95 abs error rps
            score_tuple = (
                m_test_wape,
                m_cpu_mae,
                m_mem_mae,
                m_p95_abs if m_p95_abs is not None else float("inf"),
            )
            
            candidates.append((score_tuple, run_id, {
                "test_wape_rps": m_test_wape,
                "test_mae_cpu": m_cpu_mae,
                "test_mae_mem": m_mem_mae,
                "test_p95_abs_err_rps": m_p95_abs,
                "improve_test_wape_rps": m_impr_wape,
                "improve_test_mae_cpu": m_impr_cpu,
                "improve_test_mae_mem": m_impr_mem,
            }))
        
        if not candidates:
            return None, "No candidates passed metric requirements/promotion gates"
        
        candidates.sort(key=lambda x: x[0])
        return candidates[0], None

    # ============================================================
    # K8s helpers (in-cluster, no kubectl needed)
    # ============================================================
    def _k8s_request(method: str, path: str, body: dict | None = None):
        import requests
        
        host = os.getenv("KUBERNETES_SERVICE_HOST")
        port = os.getenv("KUBERNETES_SERVICE_PORT", "443")
        if not host:
            raise RuntimeError("Kubernetes in-cluster env not found (KUBERNETES_SERVICE_HOST)")
        
        token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        
        with open(token_path, "r", encoding="utf-8") as f:
            token = f.read().strip()
        
        url = f"https://{host}:{port}{path}"
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/json",
        }
        if body is not None:
            headers["Content-Type"] = "application/merge-patch+json"
        
        r = requests.request(
            method=method,
            url=url,
            headers=headers,
            data=json.dumps(body).encode("utf-8") if body is not None else None,
            verify=ca_path,
            timeout=15,
        )
        if r.status_code >= 300:
            raise RuntimeError(f"K8S {method} {path} -> {r.status_code}: {r.text[:400]}")
        if r.text:
            return r.json()
        return None

    def patch_configmap(namespace: str, name: str, data_patch: dict):
        path = f"/api/v1/namespaces/{namespace}/configmaps/{name}"
        body = {"data": data_patch}
        _k8s_request("PATCH", path, body)

    def restart_deployment(namespace: str, name: str):
        # Patch pod template annotation to force rollout
        path = f"/apis/apps/v1/namespaces/{namespace}/deployments/{name}"
        ts = _now_iso()
        body = {
            "spec": {
                "template": {
                    "metadata": {
                        "annotations": {
                            "kubectl.kubernetes.io/restartedAt": ts
                        }
                    }
                }
            }
        }
        _k8s_request("PATCH", path, body)

    # ============================================================
    # Main
    # ============================================================
    print(f"[INFO] Register start | model={MODEL_NAME} exp={EXPERIMENT_NAME} stage={TARGET_STAGE} require_both_rps_cpu={REQUIRE_BOTH_RPS_AND_CPU} require_beat_baseline_wape={REQUIRE_BEAT_BASELINE_TEST_WAPE} eps={PROMOTION_EPS}")

    exp = mlflow.get_experiment_by_name(EXPERIMENT_NAME)
    if exp is None:
        print(f"[ERROR] Experiment not found: {EXPERIMENT_NAME}", file=sys.stderr)
        sys.exit(1)

    best, err = _pick_best_run(exp.experiment_id)
    if err:
        print(f"[ERROR] {err}", file=sys.stderr)
        sys.exit(1)

    score_tuple, run_id, met = best
    print(f"[INFO] Selected run={run_id} score={score_tuple} metrics={met}")

    # Preferred serving URI: registry Production; fallback: runs URI
    serving_uri = f"runs:/{run_id}/model"
    chosen_version = None
    registry_ok = False

    # 1) Try to ensure a registered model version exists for this run, then promote
    try:
        model_uri = f"runs:/{run_id}/model"
        # Try to create a model version (safe even if run was already registered elsewhere)
        mv = client.create_model_version(name=MODEL_NAME, source=model_uri, run_id=run_id)
        chosen_version = getattr(mv, "version", None)
        print(f"[INFO] ModelVersion created | name={MODEL_NAME} version={chosen_version}")
        
        # Promote
        if chosen_version is not None:
            if ARCHIVE_OLD:
                try:
                    latest = client.get_latest_versions(MODEL_NAME)
                    for v in latest:
                        vver = getattr(v, "version", None)
                        vstg = getattr(v, "current_stage", None)
                        if vver is not None and vstg == TARGET_STAGE and str(vver) != str(chosen_version):
                            try:
                                client.transition_model_version_stage(
                                    name=MODEL_NAME,
                                    version=str(vver),
                                    stage="Archived",
                                    archive_existing_versions=False,
                                )
                            except Exception:
                                pass
                except Exception:
                    pass
            
            client.transition_model_version_stage(
                name=MODEL_NAME,
                version=str(chosen_version),
                stage=TARGET_STAGE,
                archive_existing_versions=ARCHIVE_OLD,
            )
            serving_uri = f"models:/{MODEL_NAME}/{TARGET_STAGE}"
            registry_ok = True
            print(f"[INFO] Promoted | name={MODEL_NAME} version={chosen_version} stage={TARGET_STAGE}")
    except Exception as e:
        print(f"[WARN] Registry promotion failed, fallback to runs URI. err={e}")

    # 2) Patch serving ConfigMap + restart deployments (optional)
    if K8S_ENABLE:
        try:
            patch = {
                # generic keys (won't break consumers that ignore them)
                "MODEL_NAME": MODEL_NAME,
                "MODEL_STAGE": TARGET_STAGE if registry_ok else "RUNS",
                "MODEL_VERSION": str(chosen_version) if chosen_version is not None else "",
                "RUN_ID": run_id,
                "UPDATED_AT": _now_iso(),
                
                # main key for serving
                CONFIG_KEY_MODEL_URI: serving_uri,
            }
            patch_configmap(K8S_NAMESPACE, SERVING_CONFIGMAP, patch)
            print(f"[INFO] Patched ConfigMap {K8S_NAMESPACE}/{SERVING_CONFIGMAP} -> {CONFIG_KEY_MODEL_URI}={serving_uri}")
            
            for dep in RESTART_DEPLOYMENTS:
                restart_deployment(K8S_NAMESPACE, dep)
                print(f"[INFO] Restarted Deployment {K8S_NAMESPACE}/{dep}")
        except Exception as e:
            print(f"[ERROR] K8S patch/restart failed: {e}", file=sys.stderr)
            sys.exit(1)

    print(f"[DONE] register | model={MODEL_NAME} uri={serving_uri} registry_ok={registry_ok} run_id={run_id}")
