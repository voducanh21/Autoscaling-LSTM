apiVersion: v1
kind: ConfigMap
metadata:
  name: register-model-script
  namespace: airflow
data:
  register_model.py: |
    import os
    import mlflow
    from mlflow.tracking import MlflowClient
    import subprocess

    # ============================
    # CONFIG
    # ============================
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI", "http://mlflow.mlflow.svc.cluster.local:5000")
    MODEL_NAME = os.getenv("MODEL_NAME", "lstm_forecast")

    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
    client = MlflowClient()

    print(f"[INFO] Tracking URI: {MLFLOW_TRACKING_URI}")
    print(f"[INFO] Model Name: {MODEL_NAME}")

    # ============================
    # REQUIRED METRICS
    # ============================
    MAPE_KEYS = [
        "val_mape_rps",
        "val_mape_cpu",
        "val_mape_mem",
    ]

    # ============================
    # GET NEW MODEL (NO STAGE)
    # ============================
    latest = client.get_latest_versions(MODEL_NAME, stages=["None"])
    if not latest:
        print("❌ No new model found → exit.")
        exit(0)

    new_model = latest[0]
    new_run_id = new_model.run_id
    new_ver = new_model.version

    print(f"[NEW] Version={new_ver}, run_id={new_run_id}")

    new_metrics = client.get_run(new_run_id).data.metrics
    print(f"[NEW] Metrics: {new_metrics}")

    # Check new metrics
    for k in MAPE_KEYS:
        if k not in new_metrics:
            print(f"⚠️ Missing required metric: {k} → skip.")
            exit(0)

    # ============================
    # GET PRODUCTION MODEL
    # ============================
    prod_versions = client.get_latest_versions(MODEL_NAME, stages=["Production"])
    if prod_versions:
        prod_model = prod_versions[0]
        prod_run_id = prod_model.run_id
        prod_metrics = client.get_run(prod_run_id).data.metrics
        print(f"[PROD] Version={prod_model.version} Metrics={prod_metrics}")
    else:
        prod_model = None
        prod_metrics = {}
        print("[INFO] No Production model found → promote new one.")

    # ============================
    # DECISION LOGIC
    # ============================
    promote = False

    if prod_model is None:
        print("🆕 First model → promote.")
        promote = True
    else:
        better = True
        print("=== COMPARISON (3 METRICS) ===")

        for k in MAPE_KEYS:
            new_val = new_metrics.get(k)
            old_val = prod_metrics.get(k)

            if old_val is None:
                print(f"[WARN] Prod missing {k} → auto promote.")
                continue

            if new_val < old_val:
                print(f"✔ {k}: improved {new_val:.4f} < {old_val:.4f}")
            else:
                print(f"✖ {k}: worse {new_val:.4f} >= {old_val:.4f}")
                better = False

        promote = better

    # ============================
    # APPLY DECISION
    # ============================
    if not promote:
        print("❌ Model NOT promoted.")
        exit(0)

    print(f"🚀 PROMOTING version {new_ver} → Production")

    client.transition_model_version_stage(
        name=MODEL_NAME,
        version=new_ver,
        stage="Production",
        archive_existing_versions=True
    )

    # ============================
    # PATCH CONFIGMAP
    # ============================
    model_uri = f"models:/{MODEL_NAME}/Production"
    subprocess.run([
        "kubectl", "patch", "configmap", "lstm-config",
        "-n", "model",
        "-p", f'{{"data":{{"MODEL_URI":"{model_uri}"}}}}'
    ], check=False)

    print(f"🔁 Updated lstm-config MODEL_URI={model_uri}")

    # ============================
    # RESTART DEPLOYMENT
    # ============================
    subprocess.run([
        "kubectl", "rollout", "restart", "deployment/lstm-serving",
        "-n", "model"
    ], check=False)

    print("♻️ Restarted lstm-serving to load new model")