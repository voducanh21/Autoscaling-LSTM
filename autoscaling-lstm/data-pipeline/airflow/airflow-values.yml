##########################################
# Airflow on K3s/Minikube + MinIO Remote Logging (Final Minimal)
##########################################

executor: KubernetesExecutor

global:
  postgresql:
    auth:
      username: airflow
      password: airflowpass
      database: airflowdb

images:
  airflow:
    repository: apache/airflow
    tag: "3.1.0"
    pullPolicy: IfNotPresent

airflow:
  extraPipPackages:
    - s3fs

postgresql:
  enabled: true
  fullnameOverride: airflow-postgresql
  auth:
    username: airflow
    password: airflowpass
    database: airflowdb
    postgresPassword: postgrespass
  primary:
    persistence:
      enabled: true
      size: 8Gi

config:
  AIRFLOW__CORE__EXECUTOR: { value: "KubernetesExecutor" }
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: { value: "postgresql+psycopg2://airflow:airflowpass@airflow-postgresql:5432/airflowdb" }
  AIRFLOW__CORE__FERNET_KEY: { value: "Bgeplke0MexxR7d9zAi6ELOwxEzgd2gHfXSKcEh3TsE=" }
  AIRFLOW__API_AUTH__JWT_SECRET: { value: "my-fixed-jwt-secret-1234567890" }
  AIRFLOW__CORE__DEFAULT_TIMEZONE: { value: "Asia/Ho_Chi_Minh" }
  AIRFLOW__CORE__LOAD_EXAMPLES: { value: "false" }
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: { value: "false" }

  # Remote Logging (MinIO)
  AIRFLOW__LOGGING__REMOTE_LOGGING: { value: "True" }
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: { value: "s3://datalake/airflow-logs" }
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: { value: "minio_default" }
  AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: { value: "False" }

webserver:
  defaultUser:
    enabled: true
    username: admin
    password: admin
    email: admin@example.com
    role: Admin

dags:
  gitSync:
    enabled: true
    repo: https://github.com/voducanh21/Autoscaling-LSTM.git
    branch: main
    subPath: autoscaling-lstm/data-pipeline/dags
    credentialsSecret: airflow-git-secret

serviceAccount:
  create: true
  name: airflow
