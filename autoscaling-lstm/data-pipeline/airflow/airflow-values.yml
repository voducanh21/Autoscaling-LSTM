##########################################
# Airflow on Minikube - Chart 1.18.0 + Airflow 3.1.0
##########################################

executor: KubernetesExecutor

global:
  postgresql:
    auth:
      username: airflow
      password: airflowpass
      database: airflowdb

images:
  airflow:
    repository: apache/airflow
    tag: "3.1.0"
    pullPolicy: IfNotPresent

postgresql:
  enabled: true
  fullnameOverride: airflow-postgresql
  auth:
    username: airflow
    password: airflowpass
    database: airflowdb
    postgresPassword: postgrespass
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

config:
  AIRFLOW__CORE__EXECUTOR: { value: "KubernetesExecutor" }
  AIRFLOW__CORE__FERNET_KEY: { value: "Bgeplke0MexxR7d9zAi6ELOwxEzgd2gHfXSKcEh3TsE=" }
  AIRFLOW__CORE__DEFAULT_TIMEZONE: { value: "Asia/Ho_Chi_Minh" }
  AIRFLOW__CORE__LOAD_EXAMPLES: { value: "false" }
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: { value: "false" }
  AIRFLOW__LOGGING__REMOTE_LOGGING: { value: "False" }

  # --- FIX 1: Cấu hình đúng log server cho KubernetesExecutor ---
  AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_PORT: { value: "8793" }
  AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_ADDRESS: { value: "0.0.0.0" }

webserver:
  replicas: 1
  defaultUser:
    enabled: true
    username: admin
    password: admin
    email: admin@example.com
    role: Admin
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

scheduler:
  replicas: 1
  securityContext:
    runAsUser: 50000
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

triggerer:
  replicas: 1
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

dagProcessor:
  enabled: true
  replicas: 1
  securityContext:
    runAsUser: 0               # ⚠️ FIX: chạy bằng root để có quyền ghi log
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/voducanh21/Autoscaling-LSTM.git
    branch: main
    rev: HEAD
    depth: 1
    subPath: autoscaling-lstm/data-pipeline/dags
    credentialsSecret: airflow-git-secret

# --- FIX 2: PVC logs ---
logs:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard

# --- FIX 3: Tự động cấp quyền ghi logs ---
volumePermissions:
  enabled: true
  securityContext:
    runAsUser: 0

statsd:
  enabled: true

serviceAccount:
  create: true
  name: airflow
