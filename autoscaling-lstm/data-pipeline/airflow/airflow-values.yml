executor: KubernetesExecutor

postgresql:
  enabled: false

data:
  metadataConnection:
    user: "airflow"
    pass: "airflowpass"
    protocol: "postgresql"
    host: "airflow-pg-postgresql.ops.svc.cluster.local"
    port: 5432
    db: "airflowdb"

web:
  defaultUser:
    enabled: true
    username: admin
    password: admin

images:
  airflow:
    repository: ducanhvo/airflow-mlops
    tag: "3.1.0"
    pullPolicy: IfNotPresent

# ===========================================================
# 🔹 ENVIRONMENT VARIABLES
# ===========================================================
env:
  - name: PIP_ADDITIONAL_REQUIREMENTS
    value: "apache-airflow-providers-cncf-kubernetes==10.0.0 apache-airflow-providers-amazon s3fs kubernetes==29.0.0"

  - name: AIRFLOW__KUBERNETES__DELETE_WORKER_PODS
    value: "True"

  # ✅ FIXED: thay $(...) bằng format trực tiếp dùng biến env (được inject từ secret)
  - name: AIRFLOW_CONN_MINIO_DEFAULT
    value: "s3://minioadmin:minioadmin@minio.infra.svc.cluster.local:9000"

  - name: AWS_DEFAULT_REGION
    value: "us-east-1"


# ===========================================================
# 🔹 DAGS GIT SYNC CONFIG
# ===========================================================
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
    branch: "main"
    subPath: "autoscaling-lstm/data-pipeline/dags"
    depth: 1
    wait: 60
    credentialsSecret: "dags-git-cred"   # bật nếu repo private

# ===========================================================
# 🔹 ENVIRONMENT SOURCES (Secrets)
# ===========================================================
envFrom:
  - secretRef:
      name: airflow-secrets
  - secretRef:
      name: minio-cred   # ✅ chứa AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY

securityContext:
  fsGroup: 1000

# ===========================================================
# 🔹 AIRFLOW CONFIG (MinIO Remote Logging)
# ===========================================================
config:
  logging:
    # ✅ Bật remote logging
    remote_logging: "True"

    # ✅ ID của connection trỏ đến MinIO
    remote_log_conn_id: "minio_default"

    # ✅ Đường dẫn bucket + prefix lưu log
    remote_base_log_folder: "s3://datalake/airflow-logs"

    # ✅ Log level và encryption
    remote_log_level: "INFO"
    encrypt_s3_logs: "False"

  # (Optional) giảm noisy log ở scheduler
  core:
    logging_level: "INFO"
