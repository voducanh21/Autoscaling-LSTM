executor: KubernetesExecutor

postgresql:
  enabled: false

data:
  metadataConnection:
    user: "airflow"
    pass: "airflowpass"
    protocol: "postgresql"
    host: "airflow-pg-postgresql.ops.svc.cluster.local"
    port: 5432
    db: "airflowdb"

web:
  defaultUser:
    enabled: true
    username: admin
    password: admin

images:
  airflow:
    repository: ducanhvo/airflow-mlops
    tag: "3.1.0"
    pullPolicy: IfNotPresent

# ===========================================================
# 🔹 ENVIRONMENT VARIABLES
# ===========================================================
env:
  # ✅ Cài thêm provider khi container khởi động
  - name: PIP_ADDITIONAL_REQUIREMENTS
    value: "apache-airflow-providers-cncf-kubernetes==10.0.0 apache-airflow-providers-amazon s3fs kubernetes==29.0.0"

  # ✅ Cho phép Airflow tự xoá worker pods
  - name: AIRFLOW__KUBERNETES__DELETE_WORKER_PODS
    value: "True"

  # ✅ Remote logging sang MinIO
  - name: AIRFLOW_CONN_MINIO_DEFAULT
    value: "s3://$(AWS_ACCESS_KEY_ID):$(AWS_SECRET_ACCESS_KEY)@minio.infra.svc.cluster.local:9000"

  # (Tùy chọn, không cần với Airflow 3.1.0 — giữ lại nếu log-service sẽ được bật trong tương lai)
  - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_HOST
    value: "airflow-logs-service.ops.svc.cluster.local"
  - name: AIRFLOW__KUBERNETES__LOGS_SERVICE_PORT
    value: "8793"

# ===========================================================
# 🔹 DAGS GIT SYNC CONFIG
# ===========================================================
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
    branch: "main"
    subPath: "autoscaling-lstm/data-pipeline/dags"
    depth: 1
    wait: 60
    credentialsSecret: "dags-git-cred"   # bật nếu repo private

# ===========================================================
# 🔹 ENVIRONMENT SOURCES (Secrets)
# ===========================================================
envFrom:
  - secretRef:
      name: airflow-secrets
  - secretRef:
      name: minio-cred     # ✅ chứa AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY

securityContext:
  fsGroup: 1000

# ===========================================================
# 🔹 AIRFLOW CONFIG (MinIO Remote Logging)
# ===========================================================
config:
  logging:
    remote_logging: "True"          # ⚠️ dùng chuỗi
    remote_log_conn_id: "minio_default"
    remote_base_log_folder: "s3://datalake/airflow-logs"
    remote_log_level: "INFO"
    encrypt_s3_logs: "False"

