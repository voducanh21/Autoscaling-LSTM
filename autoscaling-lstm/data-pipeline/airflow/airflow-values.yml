# Sử dụng CeleryExecutor để cho phép chạy tác vụ phân tán trên nhiều worker
executor: CeleryExecutor

# Cấu hình cơ sở dữ liệu metadata (Postgres nội bộ)
postgresql:
  auth:
    username: airflow
    password: "airflow"
    database: airflow
    postgresPassword: "postgres"
  primary:
    persistence:
      enabled: true
      size: 1Gi
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: Always
    containerSecurityContext:
      runAsUser: 1001
  volumePermissions:
    enabled: true
    securityContext:
      runAsUser: 0

# Redis cho Celery
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# Webserver (Airflow UI)
webserver:
  service:
    type: NodePort
    ports:
      - name: airflow-ui
        port: 8080
        targetPort: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scheduler
scheduler:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Workers (Celery)
workers:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi
    fixPermissions: false       # Hỗ trợ chown PVC logs
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 768Mi            # tăng tránh OOM

# Triggerer
triggerer:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi
    fixPermissions: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi            # tăng request
    limits:
      cpu: 200m
      memory: 768Mi            # tăng limit
  livenessProbe:
    timeoutSeconds: 60
    periodSeconds: 60
    failureThreshold: 10
  env:
    - name: AIRFLOW__TRIGGERER__DEFAULT_CAPACITY
      value: "1"

# Tắt Flower
flower:
  enabled: false

# StatsD (Prometheus scrape)
statsd:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Không cần logs persistence chung
logs:
  persistence:
    enabled: false
