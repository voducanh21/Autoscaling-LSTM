##########################################
# Airflow on Minikube - Chart 1.18.0 + Airflow 3.1.0 (Fixed Log Permission)
##########################################

executor: KubernetesExecutor

global:
  postgresql:
    auth:
      username: airflow
      password: airflowpass
      database: airflowdb

images:
  airflow:
    repository: apache/airflow
    tag: "3.1.0"
    pullPolicy: IfNotPresent

postgresql:
  enabled: true
  fullnameOverride: airflow-postgresql
  auth:
    username: airflow
    password: airflowpass
    database: airflowdb
    postgresPassword: postgrespass
  primary:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

config:
  AIRFLOW__CORE__EXECUTOR: { value: "KubernetesExecutor" }
  AIRFLOW__CORE__FERNET_KEY: { value: "Bgeplke0MexxR7d9zAi6ELOwxEzgd2gHfXSKcEh3TsE=" }
  AIRFLOW__API_AUTH__JWT_SECRET: { value: "my-fixed-jwt-secret-1234567890" }
  AIRFLOW__CORE__DEFAULT_TIMEZONE: { value: "Asia/Ho_Chi_Minh" }
  AIRFLOW__CORE__LOAD_EXAMPLES: { value: "false" }
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: { value: "false" }

  # --- Logging config ---
  AIRFLOW__LOGGING__REMOTE_LOGGING: { value: "False" }
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: { value: "/opt/airflow/logs" }
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: { value: "/opt/airflow/logs" }

  # --- Kubernetes executor settings ---
  AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_ADDRESS: { value: "airflow-api-server" }
  AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_PORT: { value: "8793" }
  AIRFLOW__KUBERNETES__WORKER_CONTAINER_REPOSITORY: { value: "apache/airflow" }
  AIRFLOW__KUBERNETES__WORKER_CONTAINER_TAG: { value: "3.1.0" }
  AIRFLOW__KUBERNETES__DELETE_WORKER_PODS: { value: "False" }
  AIRFLOW__KUBERNETES__POD_TEMPLATE_FILE: { value: "/opt/airflow/pod_templates/pod_template.yaml" }

webserver:
  replicas: 1
  defaultUser:
    enabled: true
    username: admin
    password: admin
    email: admin@example.com
    role: Admin
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

scheduler:
  replicas: 1
  securityContext:
    runAsUser: 50000
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

  # ✅ FIX 1: initContainer tự cấp quyền ghi log trước khi scheduler chạy
  extraInitContainers:
    - name: fix-log-permission
      image: busybox
      command:
        - sh
        - -c
        - |
          echo "Fixing permissions for /opt/airflow/logs..."
          chown -R 50000:50000 /opt/airflow/logs || true
          chmod -R 777 /opt/airflow/logs || true
      volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs

triggerer:
  replicas: 1
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

dagProcessor:
  enabled: true
  replicas: 1
  securityContext:
    runAsUser: 0       # ⚠ chạy bằng root để ghi logs
  extraVolumeMounts:
    - name: logs
      mountPath: /opt/airflow/logs
  extraVolumes:
    - name: logs
      persistentVolumeClaim:
        claimName: airflow-logs

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/voducanh21/Autoscaling-LSTM.git
    branch: main
    rev: HEAD
    depth: 1
    subPath: autoscaling-lstm/data-pipeline/dags
    credentialsSecret: airflow-git-secret

# --- PVC logs ---
logs:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard

# --- FIX 2: cho phép initContainer chỉnh quyền ---
volumePermissions:
  enabled: true
  securityContext:
    runAsUser: 0

# --- Worker Pod Template (root user + ghi được log) ---
kubernetesPodTemplate:
  enabled: true
  template: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: airflow-worker-template
      labels:
        component: worker
    spec:
      restartPolicy: Never
      securityContext: {}
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
      containers:
        - name: base
          image: apache/airflow:3.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          env:
            - name: AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_ADDRESS
              value: airflow-api-server
            - name: AIRFLOW__KUBERNETES__WORKER_LOG_SERVER_PORT
              value: "8793"

statsd:
  enabled: true

serviceAccount:
  create: true
  name: airflow
