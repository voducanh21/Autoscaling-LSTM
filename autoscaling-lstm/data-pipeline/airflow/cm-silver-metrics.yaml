apiVersion: v1
kind: ConfigMap
metadata:
  name: silver-metrics-script
  namespace: airflow
data:
  silver_builder.py: |
    # 🥈 Silver Layer — build normalized, rolling, lag, and future-target features from Bronze
    import os, sys, json
    import pandas as pd
    import s3fs
    import pyarrow.parquet as pq
    import numpy as np
    from datetime import datetime, timedelta, timezone
    from zoneinfo import ZoneInfo

    # === ENVIRONMENT ===
    BUCKET = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PREF = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PREF = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    TZ_NAME = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")
    ROLL_LIST = json.loads(os.getenv("ROLL_WINDOWS", "[3,5,10,15,30]"))
    LAG_LIST = json.loads(os.getenv("LAG_MINUTES", "[1,2,3,5,10]"))
    HORIZON = int(os.getenv("HORIZON_MINUTES", "5"))
    CPU_LIMIT = float(os.getenv("CPU_LIMIT_CORES", "1.0"))     # per-pod CPU limit
    MEM_LIMIT = float(os.getenv("MEM_LIMIT_BYTES", "1073741824"))  # 1 GiB default

    try:
        TZ = ZoneInfo(TZ_NAME)
    except Exception:
        TZ = timezone.utc

    storage_opts = {
        "key": AWS_KEY,
        "secret": AWS_SECRET,
        "client_kwargs": {"endpoint_url": S3_ENDPOINT},
    }

    fs = s3fs.S3FileSystem(key=AWS_KEY, secret=AWS_SECRET,
                           client_kwargs={"endpoint_url": S3_ENDPOINT})

    # === STEP 1: READ BRONZE (last 30 minutes) ===
    def read_bronze():
        prefix = f"{BUCKET}/{BRONZE_PREF}/"
        now = datetime.now(timezone.utc)
        min_time = now - timedelta(minutes=30)
        print(f"[INFO] Collecting Bronze files newer than {min_time.astimezone(TZ)}")

        svc_paths = fs.glob(prefix + "date=*/service=*/")
        if not svc_paths:
            raise RuntimeError("No bronze folders found")

        dfs = []
        for path in svc_paths:
            try:
                d = path.split("/date=")[1].split("/")[0]
                svc = path.split("/service=")[1].split("/")[0]
                files = fs.glob(f"{prefix}date={d}/service={svc}/part-*.parquet")
                recent = [f for f in files if fs.info(f)["LastModified"] >= min_time]
                for fpath in recent:
                    with fs.open(fpath, "rb") as fobj:
                        df = pq.read_table(fobj).to_pandas()
                        dfs.append(df)
                print(f"[INFO] Loaded {len(recent)} files for {svc} ({d})")
            except Exception as e:
                print(f"[WARN] Skip {path}: {e}")
        if not dfs:
            raise RuntimeError("No Bronze data found in recent 30-minute window")
        return pd.concat(dfs, ignore_index=True)

    # === STEP 2: CLEAN + NORMALIZE SCHEMA ===
    def enforce_schema(df):
        df = df.copy()
        df["service"] = df["service"].astype(str)
        df["ts"] = pd.to_datetime(df["ts"], errors="coerce", utc=True)
        for c in ["rps_1m", "latency_p95_ms", "cpu_cores_1m", "mem_bytes"]:
            df[c] = pd.to_numeric(df[c], errors="coerce")
        df = df.dropna(subset=["ts", "service"])

        # normalize CPU & MEM to 0-1 range
        df["cpu_norm"] = df["cpu_cores_1m"] / CPU_LIMIT
        df["mem_norm"] = df["mem_bytes"] / MEM_LIMIT
        df["hour"] = df["ts"].dt.tz_convert(TZ).dt.hour
        df["dow"] = df["ts"].dt.tz_convert(TZ).dt.weekday
        return df.sort_values("ts")

    # === STEP 3: FEATURE ENGINEERING ===
    def add_features(g):
        g = g.drop_duplicates(subset=["ts"])
        g = g.set_index("ts").asfreq("1min")

        # Fill base metrics
        for c in ["rps_1m", "latency_p95_ms", "cpu_norm", "mem_norm"]:
            g[c] = g[c].ffill().bfill()

        # Rolling features
        for w in ROLL_LIST:
            g[f"rps_roll_mean_{w}m"] = g["rps_1m"].rolling(f"{w}min").mean()
            g[f"cpu_roll_mean_{w}m"] = g["cpu_norm"].rolling(f"{w}min").mean()
            g[f"mem_roll_mean_{w}m"] = g["mem_norm"].rolling(f"{w}min").mean()

        # Lag features
        for l in LAG_LIST:
            g[f"rps_lag_{l}m"] = g["rps_1m"].shift(l)
            g[f"cpu_lag_{l}m"] = g["cpu_norm"].shift(l)
            g[f"mem_lag_{l}m"] = g["mem_norm"].shift(l)

        # === Future targets (HORIZON minutes ahead) ===
        g["rps_future"] = g["rps_1m"].shift(-HORIZON)
        g["cpu_future"] = g["cpu_norm"].shift(-HORIZON)
        g["mem_future"] = g["mem_norm"].shift(-HORIZON)

        # Cleanup
        g = g.replace([np.inf, -np.inf], np.nan).fillna(method="bfill").fillna(method="ffill")
        g = g.dropna(subset=["rps_future", "cpu_future", "mem_future"])
        g.index = g.index.tz_convert(TZ)
        g["hour"] = g.index.hour
        g["dow"] = g.index.weekday
        return g.reset_index().rename(columns={"index": "ts"})

    # === STEP 4: WRITE SILVER ===
    def write_silver(df):
        if df.empty:
            print("[WARN] No rows to write.")
            return
        df["date"] = df["ts"].dt.tz_convert(TZ).dt.strftime("%Y-%m-%d")
        part = int(datetime.now(timezone.utc).timestamp())
        for svc, sub in df.groupby("service"):
            for d, sub2 in sub.groupby("date"):
                path = f"s3://{BUCKET}/{SILVER_PREF}/date={d}/service={svc}/part-{part}.parquet"
                sub2.drop(columns=["date"]).to_parquet(
                    path,
                    index=False,
                    engine="pyarrow",
                    storage_options=storage_opts,
                    use_dictionary=False,
                )
