apiVersion: v1
kind: ConfigMap
metadata:
  name: silver-metrics-script
  namespace: cronjob
data:
  silver_builder.py: |
    import os, sys
    import pandas as pd
    import s3fs
    import pyarrow.parquet as pq
    import numpy as np
    from datetime import datetime, timezone
    from zoneinfo import ZoneInfo

    BUCKET = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PREF = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PREF = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    TZ_NAME = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")

    # horizon in minutes for future prediction
    HORIZON = int(os.getenv("HORIZON_MINUTES", "5"))

    CPU_LIMIT_MAP = {
        "api-gateway": 1.5,
        "authentication-service": 1.0,
        "order-service": 1.0,
        "payment-service": 1.0,
        "product-service": 1.0,
    }

    MEM_LIMIT = float(os.getenv("MEM_LIMIT_BYTES", "1073741824"))

    try:
        TZ = ZoneInfo(TZ_NAME)
    except:
        TZ = timezone.utc

    storage_opts = {
        "key": AWS_KEY,
        "secret": AWS_SECRET,
        "client_kwargs": {"endpoint_url": S3_ENDPOINT},
    }

    fs = s3fs.S3FileSystem(
        key=AWS_KEY, secret=AWS_SECRET,
        client_kwargs={"endpoint_url": S3_ENDPOINT},
    )

    # ============================================================
    # Helpers
    # ============================================================

    def list_dates():
        prefix = f"{BUCKET}/{BRONZE_PREF}/"
        paths = fs.glob(prefix + "date=*/service=*/")

        dates = sorted({
            path.split("date=")[1].split("/")[0]
            for path in paths
            if "date=" in path
        })

        return dates

    def read_bronze_day(day):
        prefix = f"{BUCKET}/{BRONZE_PREF}/date={day}/"
        svc_paths = fs.glob(prefix + "service=*/")

        dfs = []
        for path in svc_paths:
            svc = path.split("/service=")[1].split("/")[0]
            files = fs.glob(f"{prefix}service={svc}/part-*.parquet")

            for f in files:
                try:
                    with fs.open(f, "rb") as fobj:
                        df = pq.read_table(fobj).to_pandas()
                        dfs.append(df)
                except Exception as e:
                    print(f"[WARN] Skip file {f}: {e}")

        if not dfs:
            return None

        return pd.concat(dfs, ignore_index=True)

    # ============================================================
    # Schema + Normalization
    # ============================================================

    def enforce_schema(df):
        df = df.copy()

        df["service"] = df["service"].astype(str)
        df["ts"] = pd.to_datetime(df["ts"], errors="coerce", utc=True)

        for c in ["rps_1m", "latency_p95_ms", "cpu_cores_1m", "mem_bytes"]:
            df[c] = pd.to_numeric(df[c], errors="coerce")

        df = df.dropna(subset=["ts", "service"])

        df["cpu_norm"] = df.apply(
            lambda r: r["cpu_cores_1m"] / CPU_LIMIT_MAP.get(r["service"], 1.0),
            axis=1
        )

        df["mem_norm"] = df["mem_bytes"] / MEM_LIMIT

        return df.sort_values("ts")

    # ============================================================
    # Feature Engineering (reduced + target)
    # ============================================================

    def add_features(g):
        g = g.drop_duplicates(subset=["ts"])
        g = g.set_index("ts").asfreq("1min")

        # raw metrics
        for c in ["rps_1m", "latency_p95_ms", "cpu_norm", "mem_norm"]:
            g[c] = g[c].ffill().bfill()

        # rolling
        g["rps_roll_mean_5m"] = g["rps_1m"].rolling("5min").mean()
        g["rps_roll_mean_15m"] = g["rps_1m"].rolling("15min").mean()

        # lag
        g["rps_lag_1m"] = g["rps_1m"].shift(1)
        g["cpu_lag_1m"] = g["cpu_norm"].shift(1)
        g["mem_lag_1m"] = g["mem_norm"].shift(1)

        # target (future)
        g["rps_future"] = g["rps_1m"].shift(-HORIZON)
        g["cpu_future"] = g["cpu_norm"].shift(-HORIZON)
        g["mem_future"] = g["mem_norm"].shift(-HORIZON)

        # cleanup
        g.replace([np.inf, -np.inf], np.nan, inplace=True)
        g = g.fillna(method="bfill").fillna(method="ffill")

        # drop rows missing target
        g = g.dropna(subset=["rps_future", "cpu_future", "mem_future"])

        # restore timestamp
        g.index = g.index.tz_convert(TZ)
        g["hour"] = g.index.hour
        g["dow"] = g.index.weekday

        return g.reset_index().rename(columns={"index": "ts"})

    # ============================================================
    # Write Partitioned Silver
    # ============================================================

    def write_silver(df):
        if df.empty:
            print("[WARN] No rows to write.")
            return

        df["date"] = df["ts"].dt.tz_convert(TZ).dt.strftime("%Y-%m-%d")
        part = int(datetime.now(timezone.utc).timestamp())

        for svc, sub in df.groupby("service"):
            for d, sub2 in sub.groupby("date"):
                path = f"s3://{BUCKET}/{SILVER_PREF}/date={d}/service={svc}/part-{part}.parquet"

                sub2.drop(columns=["date"]).to_parquet(
                    path,
                    index=False,
                    engine="pyarrow",
                    storage_options=storage_opts,
                    use_dictionary=False,
                )

                print(f"[OK] wrote {path} (rows={len(sub2)})")

    # ============================================================
    # Main
    # ============================================================

    def main():
        dates = list_dates()
        print(f"[INFO] Found {len(dates)} dates: {dates}")

        for d in dates:
            print(f"[INFO] Processing date: {d}")

            df = read_bronze_day(d)
            if df is None:
                print(f"[WARN] No data for date: {d}")
                continue

            df_clean = enforce_schema(df)

            result = []
            for svc, g in df_clean.groupby("service"):
                result.append(add_features(g))

            df_final = pd.concat(result, ignore_index=True)
            df_final = df_final.drop_duplicates(subset=["service", "ts"], keep="last")

            write_silver(df_final)
            print(f"[OK] Completed Silver for date={d}")

        print("[INFO] Silver pipeline finished.")

    if __name__ == "__main__":
        main()
