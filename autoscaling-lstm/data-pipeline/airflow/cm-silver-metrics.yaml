apiVersion: v1
kind: ConfigMap
metadata:
  name: silver-metrics-script
  namespace: airflow
data:
  silver_builder.py: |
    # 🥈 Silver Layer (use same S3 logic as Bronze)
    import os, sys
    import pandas as pd
    import pyarrow as pa, pyarrow.parquet as pq
    import s3fs

    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PATH = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PATH = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")

    fs = s3fs.S3FileSystem(client_kwargs={"endpoint_url": S3_ENDPOINT})

    SCHEMA = pa.schema([
        ("ts", pa.string()),
        ("service", pa.string()),
        ("rps_1m", pa.float64()),
        ("latency_p95_ms", pa.float64()),
        ("cpu_cores_1m", pa.float64()),
        ("mem_bytes", pa.float64()),
        ("hour", pa.int64()),
        ("dow", pa.int64()),
    ])

    def main():
        try:
            files = fs.glob(f"{BUCKET}/{BRONZE_PATH}/date=*/service=*/*.parquet")
            if not files:
                print("[WARN] No bronze parquet files found")
                return

            dfs = []
            for f in files:
                try:
                    with fs.open(f, "rb") as f_in:
                        table = pq.read_table(f_in).combine_chunks().cast(SCHEMA, safe=False)
                        dfs.append(table.to_pandas())
                except Exception as e:
                    print(f"[WARN] Skip {f} ({e})", file=sys.stderr)

            if not dfs:
                print("[WARN] No valid parquet data")
                return

            df = pd.concat(dfs, ignore_index=True)
            df = df.dropna(subset=["service", "ts"]).sort_values("ts")

            df = df.astype({
                "service": "string",
                "ts": "string",
                "rps_1m": "float64",
                "latency_p95_ms": "float64",
                "cpu_cores_1m": "float64",
                "mem_bytes": "float64",
                "hour": "int64",
                "dow": "int64",
            })

            out_path = f"{BUCKET}/{SILVER_PATH}/silver-{pd.Timestamp.now().strftime('%Y%m%d%H%M%S')}.parquet"
            with fs.open(out_path, "wb") as f_out:
                pq.write_table(pa.Table.from_pandas(df, preserve_index=False).cast(SCHEMA, safe=False), f_out)
            print(f"[OK] wrote s3://{out_path}")

        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()
