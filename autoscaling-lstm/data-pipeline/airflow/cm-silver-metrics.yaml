apiVersion: v1
kind: ConfigMap
metadata:
  name: silver-metrics-script
  namespace: airflow
data:
  silver_builder.py: |
    # 🥈 Silver Layer — build rolling + lag features from Bronze (reads last 30 minutes, no state file)
    import os, sys, json
    import pandas as pd
    import s3fs
    import pyarrow.parquet as pq
    from datetime import datetime, timedelta, timezone
    from zoneinfo import ZoneInfo

    BUCKET = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PREF = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PREF = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    TZ_NAME = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")
    ROLL_LIST = json.loads(os.getenv("ROLL_WINDOWS", "[3,5,10]"))
    LAG_LIST = json.loads(os.getenv("LAG_MINUTES", "[1,2,3,5,10]"))

    try:
        TZ = ZoneInfo(TZ_NAME)
    except Exception:
        TZ = timezone.utc

    storage_opts = {
        "key": AWS_KEY,
        "secret": AWS_SECRET,
        "client_kwargs": {"endpoint_url": S3_ENDPOINT},
    }

    fs = s3fs.S3FileSystem(
        key=AWS_KEY,
        secret=AWS_SECRET,
        client_kwargs={"endpoint_url": S3_ENDPOINT},
    )

    # --- STEP 1: READ BRONZE (last 30 minutes) ---
    def read_bronze():
        prefix = f"{BUCKET}/{BRONZE_PREF}/"
        now = datetime.now(timezone.utc)
        min_time = now - timedelta(minutes=30)
        print(f"[INFO] Collecting Bronze files newer than {min_time.astimezone(TZ)} (local TZ={TZ_NAME})")


        svc_paths = fs.glob(prefix + "date=*/service=*/")
        if not svc_paths:
            raise RuntimeError("No bronze folders found")

        dfs, latest_seen = [], None

        for path in svc_paths:
            try:
                d = path.split("/date=")[1].split("/")[0]
                svc = path.split("/service=")[1].split("/")[0]

                files = fs.glob(f"{prefix}date={d}/service={svc}/part-*.parquet")
                recent = [f for f in files if fs.info(f)["LastModified"] >= min_time]
                if not recent:
                    continue

                for fpath in recent:
                    with fs.open(fpath, "rb") as fobj:
                        df = pq.read_table(fobj).to_pandas()
                        dfs.append(df)

                latest_ts = max(fs.info(f)["LastModified"] for f in recent)
                if not latest_seen or latest_ts > latest_seen:
                    latest_seen = latest_ts

                print(f"[INFO] Loaded {len(recent)} files for {svc} ({d})")

            except Exception as e:
                print(f"[WARN] Skip {path}: {e}")

        if not dfs:
            raise RuntimeError("No Bronze data found in recent 30-minute window")

        return pd.concat(dfs, ignore_index=True), latest_seen

    # --- STEP 2: CLEAN SCHEMA ---
    def enforce_schema(df):
        df = df.copy()
        df["service"] = df["service"].astype(str)
        df["ts"] = pd.to_datetime(df["ts"], errors="coerce", utc=True)
        for c in ["rps_1m", "latency_p95_ms", "cpu_cores_1m", "mem_bytes"]:
            df[c] = pd.to_numeric(df[c], errors="coerce")
        df = df.dropna(subset=["ts", "service"])
        df["hour"] = df["ts"].dt.tz_convert(TZ).dt.hour
        df["dow"] = df["ts"].dt.tz_convert(TZ).dt.weekday
        return df.sort_values("ts")

    # --- STEP 3: ADD FEATURES ---
    def add_features(g):
        g = g.drop_duplicates(subset=["ts"])
        g = g.set_index("ts").asfreq("min")
        for c in ["rps_1m", "latency_p95_ms", "cpu_cores_1m", "mem_bytes"]:
            g[c] = g[c].ffill()

        for w in ROLL_LIST:
            g[f"rps_roll_mean_{w}m"] = g["rps_1m"].rolling(f"{w}min").mean()
            g[f"p95_roll_mean_{w}m"] = g["latency_p95_ms"].rolling(f"{w}min").mean()

        for l in LAG_LIST:
            g[f"rps_lag_{l}m"] = g["rps_1m"].shift(l)
            g[f"p95_lag_{l}m"] = g["latency_p95_ms"].shift(l)
            g[f"cpu_lag_{l}m"] = g["cpu_cores_1m"].shift(l)
            g[f"mem_lag_{l}m"] = g["mem_bytes"].shift(l)

        g.index = g.index.tz_convert(TZ)
        g["hour"] = g.index.hour
        g["dow"] = g.index.weekday
        return g.reset_index().rename(columns={"index": "ts"})

    # --- STEP 4: WRITE SILVER ---
    def write_silver(df):
        if df.empty:
            print("[WARN] No rows to write.")
            return
        df["date"] = df["ts"].dt.tz_convert(TZ).dt.strftime("%Y-%m-%d")
        now = datetime.now(timezone.utc)
        part = int(now.timestamp())

        for svc, sub in df.groupby("service"):
            for d, sub2 in sub.groupby("date"):
                silver_path = f"s3://{BUCKET}/{SILVER_PREF}/date={d}/service={svc}/part-{part}.parquet"
                sub2.drop(columns=["date"]).to_parquet(
                    silver_path,
                    index=False,
                    engine="pyarrow",
                    storage_options=storage_opts,
                    use_dictionary=False,
                )
                print(f"[OK] wrote {silver_path} ({len(sub2)} rows)")

    # --- MAIN ---
    def main():
        try:
            raw, _ = read_bronze()
            raw = enforce_schema(raw)
            raw["date"] = raw["ts"].dt.tz_convert(TZ).dt.strftime("%Y-%m-%d")

            results = []
            for d, part in raw.groupby("date"):
                print(f"[INFO] Processing date {d} ({len(part)} rows)")
                sub = part.groupby("service", group_keys=False).apply(add_features)
                results.append(sub)

            out = pd.concat(results, ignore_index=True)
            print(f"[INFO] Output rows: {len(out)}")

            write_silver(out)

        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()
