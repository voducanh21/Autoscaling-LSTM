apiVersion: v1
kind: ConfigMap
metadata:
  name: silver-metrics-script
  namespace: airflow
data:
  silver_builder.py: |
    # 🥈 Silver Layer with native PyArrow S3 client
    import os, sys
    import pandas as pd
    import pyarrow as pa
    import pyarrow.parquet as pq
    import pyarrow.dataset as ds

    # Environment variables
    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PATH = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PATH = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    ACCESS_KEY  = os.getenv("AWS_ACCESS_KEY_ID")
    SECRET_KEY  = os.getenv("AWS_SECRET_ACCESS_KEY")

    # Create filesystem
    s3_fs = pa.fs.S3FileSystem(
        access_key=ACCESS_KEY,
        secret_key=SECRET_KEY,
        endpoint_override=S3_ENDPOINT
    )

    SCHEMA = pa.schema([
        ("ts", pa.string()),
        ("service", pa.string()),
        ("rps_1m", pa.float64()),
        ("latency_p95_ms", pa.float64()),
        ("cpu_cores_1m", pa.float64()),
        ("mem_bytes", pa.float64()),
        ("hour", pa.int64()),
        ("dow", pa.int64()),
    ])

    def read_bronze_dataset():
        """Đọc toàn bộ bronze dataset không partition inference"""
        path = f"s3://{BUCKET}/{BRONZE_PATH}"
        dataset = ds.dataset(path, format="parquet", filesystem=s3_fs, partitioning="hive")
        table = dataset.to_table().combine_chunks()
        # Giải mã dictionary nếu cần
        for name in table.schema.names:
            col = table[name]
            if pa.types.is_dictionary(col.type):
                table = table.set_column(table.schema.get_field_index(name), name, col.dictionary_decode())
        return table.cast(SCHEMA, safe=False).to_pandas()

    def main():
        try:
            df = read_bronze_dataset()
            if df.empty:
                print("[WARN] Bronze dataset empty")
                return

            df = df.dropna(subset=["service", "ts"]).sort_values("ts")
            df = df.astype({
                "service": "string",
                "ts": "string",
                "rps_1m": "float64",
                "latency_p95_ms": "float64",
                "cpu_cores_1m": "float64",
                "mem_bytes": "float64",
                "hour": "int64",
                "dow": "int64",
            })

            out_uri = f"s3://{BUCKET}/{SILVER_PATH}/silver-{pd.Timestamp.now().strftime('%Y%m%d%H%M%S')}.parquet"
            pq.write_table(pa.Table.from_pandas(df, preserve_index=False), out_uri, filesystem=s3_fs, use_dictionary=False)
            print(f"[OK] wrote {out_uri}")
        except Exception as e:
            import traceback
            traceback.print_exc()
            sys.exit(1)

    if __name__ == "__main__":
        main()
