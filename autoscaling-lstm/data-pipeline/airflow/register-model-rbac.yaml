# 01-register-model-rbac.yaml

# ServiceAccount dùng bởi KubernetesPodOperator (pod chạy trong namespace airflow)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: register-model-sa
  namespace: airflow
---
# Quyền patch ConfigMap + Deployment trong namespace model
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-manager
  namespace: model
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
# Bind Role (namespace model) cho ServiceAccount ở namespace airflow
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-manager-binding
  namespace: model
subjects:
  - kind: ServiceAccount
    name: register-model-sa
    namespace: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-manager
