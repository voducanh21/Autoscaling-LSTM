apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-scripts
  namespace: ops
data:
  metrics_dumper.py: |
    # 🥉 Bronze Layer
    import os, sys
    import requests
    import pandas as pd
    from datetime import datetime, timezone
    from zoneinfo import ZoneInfo

    PROM_URL    = os.getenv("PROM_URL")
    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    PREFIX      = os.getenv("S3_PREFIX", "bronze/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY     = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET  = os.getenv("AWS_SECRET_ACCESS_KEY")
    TZ_NAME     = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")

    try:
        TZ = ZoneInfo(TZ_NAME)
    except Exception:
        print(f"[WARN] ZoneInfo('{TZ_NAME}') not available. Fallback to UTC.", file=sys.stderr)
        TZ = timezone.utc

    storage_opts = {
        "key": AWS_KEY,
        "secret": AWS_SECRET,
        "client_kwargs": {"endpoint_url": S3_ENDPOINT}
    }

    def prom_query(q):
        r = requests.get(f"{PROM_URL}/api/v1/query", params={"query": q}, timeout=10)
        r.raise_for_status()
        return r.json()["data"]["result"]

    def get_scalar(query):
        res = prom_query(query)
        if not res:
            return None
        try:
            return float(res[0]["value"][1])
        except Exception:
            return None

    def get_cpu_cores_1m(service):
        return get_scalar(f'sum(pod:cpu:usage1m{{namespace="apps",pod=~"{service}-.*"}})')

    def get_mem_bytes(service):
        return get_scalar(f'sum(pod:mem:usage{{namespace="apps",pod=~"{service}-.*"}})')

    def collect(service):
        rps = get_scalar(f'svc:qps:rate1m{{job="{service}"}}')
        p95_ms = get_scalar(f'svc:latency_p95_ms_1m{{job="{service}"}}')
        cpu = get_cpu_cores_1m(service)
        mem = get_mem_bytes(service)

        now = datetime.now(TZ)
        return {
            "ts": now.isoformat(),
            "service": service,
            "rps_1m": rps,
            "latency_p95_ms": p95_ms,
            "cpu_cores_1m": cpu,
            "mem_bytes": mem,
            "hour": now.hour,
            "dow": now.weekday()
        }

    def main():
        try:
            jobs = {m["metric"]["job"] for m in prom_query("svc:qps:rate1m")}
            if not jobs:
                print("[WARN] No services discovered from svc:qps:rate1m"); return

            rows = [collect(svc) for svc in sorted(jobs)]
            df = pd.DataFrame(rows)

            now = datetime.now(TZ)
            date = now.strftime("%Y-%m-%d")
            part = int(now.timestamp())

            for svc, sub in df.groupby("service"):
                path = f"s3://{BUCKET}/{PREFIX}/date={date}/service={svc}/part-{part}.parquet"
                sub.to_parquet(path, index=False, storage_options=storage_opts)
                print(f"[OK] wrote {path} (tz={TZ_NAME})")
        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()

  silver_builder.py: |
    # 🥈 Silver Layer
    import os, sys
    import pandas as pd
    import pyarrow.parquet as pq
    import s3fs

    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PATH = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    SILVER_PATH = os.getenv("SILVER_PREFIX", "silver/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")

    fs = s3fs.S3FileSystem(client_kwargs={"endpoint_url": S3_ENDPOINT})

    def main():
        try:
            files = fs.glob(f"{BUCKET}/{BRONZE_PATH}/**/*.parquet")
            if not files:
                print("[WARN] no bronze data found"); return

            dfs = [pd.read_parquet(f"s3://{f}", storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}}) for f in files]
            df = pd.concat(dfs)
            df = df.dropna().sort_values("ts")

            out_path = f"s3://{BUCKET}/{SILVER_PATH}/silver-{pd.Timestamp.now().strftime('%Y%m%d%H%M%S')}.parquet"
            df.to_parquet(out_path, index=False, storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}})
            print(f"[OK] wrote {out_path}")
        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()

  gold_aggregator.py: |
    # 🥇 Gold Layer
    import os, sys
    import pandas as pd
    import s3fs

    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    SILVER_PATH = os.getenv("SILVER_PREFIX", "silver/metrics")
    GOLD_PATH   = os.getenv("GOLD_PREFIX", "gold/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")

    fs = s3fs.S3FileSystem(client_kwargs={"endpoint_url": S3_ENDPOINT})

    def main():
        try:
            files = fs.glob(f"{BUCKET}/{SILVER_PATH}/*.parquet")
            if not files:
                print("[WARN] no silver data found"); return

            dfs = [pd.read_parquet(f"s3://{f}", storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}}) for f in files]
            df = pd.concat(dfs)

            agg = (
                df.groupby(["service", "hour", "dow"])
                .agg({"rps_1m": "mean", "latency_p95_ms": "mean", "cpu_cores_1m": "mean", "mem_bytes": "mean"})
                .reset_index()
            )

            out_path = f"s3://{BUCKET}/{GOLD_PATH}/gold-{pd.Timestamp.now().strftime('%Y%m%d%H%M%S')}.parquet"
            agg.to_parquet(out_path, index=False, storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}})
            print(f"[OK] wrote {out_path}")
        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()
