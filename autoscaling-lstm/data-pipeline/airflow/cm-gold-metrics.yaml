apiVersion: v1
kind: ConfigMap
metadata:
  name: gold-metrics-script
  namespace: airflow
data:
  gold_aggregator.py: |
    # 🥇 Gold Layer
    import os, sys
    import pandas as pd
    import s3fs

    BUCKET      = os.getenv("S3_BUCKET", "datalake")
    SILVER_PATH = os.getenv("SILVER_PREFIX", "silver/metrics")
    GOLD_PATH   = os.getenv("GOLD_PREFIX", "gold/metrics")
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")

    fs = s3fs.S3FileSystem(client_kwargs={"endpoint_url": S3_ENDPOINT})

    def main():
        try:
            files = fs.glob(f"{BUCKET}/{SILVER_PATH}/*.parquet")
            if not files:
                print("[WARN] no silver data found"); return
            dfs = []
            for f in files:
                try:
                    d = pd.read_parquet(
                        f"s3://{f}",
                        storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}}
                    )
                    if "service" in d.columns:
                        d["service"] = d["service"].astype(str)
                    dfs.append(d)
                except Exception as e:
                    print(f"[WARN] skip {f} ({e})", file=sys.stderr)
            if not dfs:
                print("[WARN] no valid silver files")
                return
            df = pd.concat(dfs, ignore_index=True)
            agg = (
                df.groupby(["service", "hour", "dow"], dropna=True)
                .agg({
                    "rps_1m": "mean",
                    "latency_p95_ms": "mean",
                    "cpu_cores_1m": "mean",
                    "mem_bytes": "mean"
                })
                .reset_index()
            )
            out_path = f"s3://{BUCKET}/{GOLD_PATH}/gold-{pd.Timestamp.now().strftime('%Y%m%d%H%M%S')}.parquet"
            agg.to_parquet(
                out_path,
                index=False,
                storage_options={"client_kwargs": {"endpoint_url": S3_ENDPOINT}}
            )
            print(f"[OK] wrote {out_path}")
        except Exception as e:
            print(f"[ERROR] {e}", file=sys.stderr)
            sys.exit(1)

    if __name__ == "__main__":
        main()
