apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-checker-script
  namespace: airflow
data:
  drift_checker.py: |
    import os
    import json
    import requests
    import numpy as np
    import pandas as pd
    import pyarrow.parquet as pq
    import s3fs
    from datetime import datetime, timedelta

    FEATURES = ["rps_1m", "cpu_cores_1m", "mem_bytes", "hour", "dow"]

    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    BUCKET = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PREFIX = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    BASELINE_PATH = os.getenv("BASELINE_PATH", "baseline/stats.parquet")

    PSI_THRESHOLD = float(os.getenv("PSI_THRESHOLD", "0.25"))
    LOOKBACK_HOURS = int(os.getenv("LOOKBACK_HOURS", "3"))

    AIRFLOW_URL = os.getenv("AIRFLOW_URL")
    AIRFLOW_USERNAME = os.getenv("AIRFLOW_USERNAME")
    AIRFLOW_PASSWORD = os.getenv("AIRFLOW_PASSWORD")
    TRAIN_DAG_ID = os.getenv("TRAIN_DAG_ID", "train_lstm_dag")

    def load_baseline(fs):
        with fs.open(f"{BUCKET}/{BASELINE_PATH}", "rb") as f:
            return pq.read_table(f).to_pandas()

    def load_recent(fs):
        now = datetime.now()
        start = now - timedelta(hours=LOOKBACK_HOURS)
        date_str = now.strftime("%Y-%m-%d")
        paths = fs.glob(f"{BUCKET}/{BRONZE_PREFIX}/date={date_str}/service=*/part-*.parquet")

        dfs = []
        for p in paths:
            with fs.open(p, "rb") as f:
                df = pq.read_table(f).to_pandas()
                df["ts"] = pd.to_datetime(df["ts"])
                df = df[df["ts"] >= start]
                if not df.empty:
                    dfs.append(df)

        if not dfs:
            return None

        return pd.concat(dfs, ignore_index=True)[FEATURES]

    def psi(expected, actual):
        psi_values = {}
        eps = 1e-6

        for feat in FEATURES:
            e = expected[feat].values
            a = actual[feat].values

            quantiles = np.linspace(0, 1, 11)
            bins = np.quantile(e, quantiles)

            e_perc, _ = np.histogram(e, bins=bins)
            a_perc, _ = np.histogram(a, bins=bins)

            e_perc = e_perc / (len(e) + eps)
            a_perc = a_perc / (len(a) + eps)

            psi = np.sum((a_perc - e_perc) * np.log((a_perc + eps) / (e_perc + eps)))
            psi_values[feat] = psi

        return psi_values

    def trigger_airflow():
        url = f"{AIRFLOW_URL}/api/v1/dags/{TRAIN_DAG_ID}/dagRuns"
        payload = {"conf": {"reason": "psi_drift"}}

        r = requests.post(
            url,
            auth=(AIRFLOW_USERNAME, AIRFLOW_PASSWORD),
            headers={"Content-Type": "application/json"},
            data=json.dumps(payload)
        )

        print("[DRIFT] Airflow Trigger:", r.status_code, r.text)

    if __name__ == "__main__":
        print("[DRIFT] Drift checker started")

        fs = s3fs.S3FileSystem(
            key=AWS_KEY,
            secret=AWS_SECRET,
            client_kwargs={"endpoint_url": S3_ENDPOINT}
        )

        baseline = load_baseline(fs)
        recent = load_recent(fs)

        if recent is None:
            print("[DRIFT] No recent data → skip")
            exit(0)

        psi_scores = psi(baseline, recent)
        print("[DRIFT] PSI:", psi_scores)

        if any(v > PSI_THRESHOLD for v in psi_scores.values()):
            print("[DRIFT] DRIFT DETECTED → trigger train")
            trigger_airflow()
        else:
            print("[DRIFT] No drift detected")
