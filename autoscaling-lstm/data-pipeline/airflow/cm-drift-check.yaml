apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-checker-script
  namespace: airflow
data:
  drift_checker.py: |
    import os
    import json
    import requests
    import numpy as np
    import pandas as pd
    import pyarrow.parquet as pq
    import s3fs
    from datetime import datetime, timedelta

    # ============================================
    # CONFIG
    # ============================================
    FEATURES = ["rps_1m", "cpu_cores_1m", "mem_bytes"]

    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")

    BUCKET = os.getenv("S3_BUCKET", "datalake")
    BRONZE_PREFIX = os.getenv("BRONZE_PREFIX", "bronze/metrics")
    BASELINE_PATH = os.getenv("BASELINE_PATH", "baseline/metrics/baseline_latest.parquet")

    LOOKBACK_HOURS = int(os.getenv("LOOKBACK_HOURS", "1"))
    PSI_THRESHOLD = float(os.getenv("PSI_THRESHOLD", "0.25"))

    # airflow trigger
    AIRFLOW_URL = os.getenv("AIRFLOW_URL")
    AIRFLOW_USERNAME = os.getenv("AIRFLOW_USERNAME")
    AIRFLOW_PASSWORD = os.getenv("AIRFLOW_PASSWORD")
    TRAIN_DAG_ID = os.getenv("TRAIN_DAG_ID", "train_lstm_dag")

    # ============================================
    # Load baseline stats
    # ============================================
    def load_baseline(fs):
        with fs.open(f"{BUCKET}/{BASELINE_PATH}", "rb") as f:
            df = pq.read_table(f).to_pandas()

        base = {}
        for _, row in df.iterrows():
            base[row["metric"]] = row
        return base

    # ============================================
    # Load recent bronze rows
    # ============================================
    def load_recent(fs):
        now = datetime.now()
        start = now - timedelta(hours=LOOKBACK_HOURS)

        today = now.strftime("%Y-%m-%d")
        yesterday = (now - timedelta(days=1)).strftime("%Y-%m-%d")

        dfs = []
        for date in [today, yesterday]:
            pattern = f"{BUCKET}/{BRONZE_PREFIX}/date={date}/service=*/part-*.parquet"
            paths = fs.glob(pattern)

            for p in paths:
                try:
                    with fs.open(p, "rb") as f:
                        df = pq.read_table(f).to_pandas()
                        df["ts"] = pd.to_datetime(df["ts"])
                        df = df[df["ts"] >= start]
                        if not df.empty:
                            dfs.append(df)
                except Exception as e:
                    print(f"[DRIFT] WARN: Failed to load {p}: {e}")

        if not dfs:
            return None

        df_recent = pd.concat(dfs, ignore_index=True)
        return df_recent[FEATURES]

    # ============================================
    # PSI calculator (CORRECT VERSION)
    # ============================================
    def psi(baseline_stats, recent_df):
        psi_scores = {}
        eps = 1e-6

        for feat in FEATURES:
            values = recent_df[feat].astype(float)

            # Fixed bins from baseline
            bins = [
                baseline_stats[feat]["min"],
                baseline_stats[feat]["p10"],
                baseline_stats[feat]["p50"],
                baseline_stats[feat]["p90"],
                baseline_stats[feat]["max"],
            ]

            bins = np.unique(sorted(bins))

            # Fallback if bins collapse
            if len(bins) < 3:
                q = np.linspace(0, 1, 6)
                bins = np.quantile(values, q)

            # ======================
            # Compute expected distribution from baseline percentiles
            # ======================
            base_min = baseline_stats[feat]["min"]
            base_p10 = baseline_stats[feat]["p10"]
            base_p50 = baseline_stats[feat]["p50"]
            base_p90 = baseline_stats[feat]["p90"]
            base_max = baseline_stats[feat]["max"]

            # Expected proportions
            expected = np.array([
                0.10,   # min → p10
                0.40,   # p10 → p50
                0.40,   # p50 → p90
                0.10    # p90 → max
            ])

            expected = expected / expected.sum()

            # ======================
            # Actual distribution from recent histogram
            # ======================
            actual, _ = np.histogram(values, bins=bins)
            actual = actual / (len(values) + eps)

            # ======================
            # PSI
            # ======================
            score = np.sum((actual - expected) * np.log((actual + eps) / (expected + eps)))
            psi_scores[feat] = float(score)

        return psi_scores

    # ============================================
    # Airflow trigger
    # ============================================
    def trigger_airflow():
        url = f"{AIRFLOW_URL}/api/v1/dags/{TRAIN_DAG_ID}/dagRuns"
        payload = {"conf": {"reason": "psi_drift"}}

        r = requests.post(
            url,
            auth=(AIRFLOW_USERNAME, AIRFLOW_PASSWORD),
            headers={"Content-Type": "application/json"},
            data=json.dumps(payload)
        )

        print("[DRIFT] Airflow Trigger:", r.status_code, r.text)

    # ============================================
    # MAIN
    # ============================================
    if __name__ == "__main__":
        print("[DRIFT] Starting drift checker")

        fs = s3fs.S3FileSystem(
            key=AWS_KEY,
            secret=AWS_SECRET,
            client_kwargs={"endpoint_url": S3_ENDPOINT}
        )

        baseline = load_baseline(fs)
        recent = load_recent(fs)

        if recent is None:
            print("[DRIFT] No recent data → skip")
            exit(0)

        psi_scores = psi(baseline, recent)
        print("[DRIFT] PSI:", psi_scores)

        drift = any(v > PSI_THRESHOLD for v in psi_scores.values())

        if drift:
            print("[DRIFT] DRIFT DETECTED → TRIGGER TRAIN")
            trigger_airflow()
        else:
            print("[DRIFT] No drift detected")
