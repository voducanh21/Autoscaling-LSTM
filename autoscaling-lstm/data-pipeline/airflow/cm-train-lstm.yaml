apiVersion: v1
kind: ConfigMap
metadata:
  name: train-lstm-script
  namespace: cronjob
data:
  train_lstm.py: |
    import os, sys, s3fs, pandas as pd, pyarrow.parquet as pq, numpy as np
    from tensorflow.keras.layers import Input, Embedding, LSTM, Dense, Dropout, Concatenate
    from tensorflow.keras.models import Model
    from tensorflow.keras.optimizers import Adam
    from sklearn.preprocessing import MinMaxScaler
    from sklearn.metrics import mean_absolute_error
    import mlflow
    import mlflow.keras

    # ============================================================
    # safe MAPE — ignore values where true≈0 (avoid explosion)
    # ============================================================
    def safe_mape(y_true, y_pred, eps=1e-3):
        y_true = np.asarray(y_true, dtype=float)
        y_pred = np.asarray(y_pred, dtype=float)

        mask = np.abs(y_true) > eps
        if not np.any(mask):
            return 0.0

        return np.mean(np.abs((y_true[mask] - y_pred[mask]) / y_true[mask]))

    # ==== ENV DUMP ====
    print("=== ENVIRONMENT DUMP (MLFLOW + S3) ===")
    for k, v in os.environ.items():
        if any(x in k for x in ["MLFLOW", "S3", "AWS"]):
            print(f"{k}={v}")
    print("=======================================")

    # ==== ENV ====
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    SILVER_PREFIX = os.getenv("SILVER_PREFIX", "silver/metrics")
    BUCKET = os.getenv("S3_BUCKET", "datalake")
    MLFLOW_TRACKING_URI = os.getenv("MLFLOW_TRACKING_URI")

    WINDOW_SIZE = int(os.getenv("WINDOW_SIZE", "10"))
    EPOCHS = 20
    BATCH = 128

    FORCE_HTTP = os.getenv("AWS_STORAGE_FORCE_HTTP", "false").lower() == "true"
    client_args = {"endpoint_url": S3_ENDPOINT}
    if FORCE_HTTP:
        client_args["verify"] = False

    # ==== S3 FS ====
    fs = s3fs.S3FileSystem(key=AWS_KEY, secret=AWS_SECRET, client_kwargs=client_args)

    prefix = f"{BUCKET}/{SILVER_PREFIX}/"
    svc_paths = fs.glob(prefix + "date=*/service=*/")
    if not svc_paths:
        print(f"[ERROR] No silver folders found under {prefix}", file=sys.stderr)
        sys.exit(1)

    # ==== LOAD DATA ====
    dfs = []
    for path in svc_paths:
        try:
            date_part = path.split("/date=")[1].split("/")[0]
            service = path.split("/service=")[1].split("/")[0]
            parquet_files = fs.glob(f"{prefix}date={date_part}/service={service}/part-*.parquet")

            for f in parquet_files:
                with fs.open(f, "rb") as fobj:
                    df = pq.read_table(fobj).to_pandas()
                    df["service"] = service
                    dfs.append(df)

        except Exception as e:
            print(f"[WARN] Skip {path}: {e}")

    if not dfs:
        print("[ERROR] No parquet data loaded", file=sys.stderr)
        sys.exit(1)

    df = pd.concat(dfs, ignore_index=True)
    print(f"[OK] Loaded total {len(df)} rows from Silver layer")
    print("Services found:", df["service"].unique())

    # ============================================================
    # FIXED SERVICE MAPPING
    # ============================================================
    FIXED_ORDER = [
        "api-gateway",
        "authentication-service",
        "order-service",
        "payment-service",
        "product-service",
    ]

    df = df[df["service"].isin(FIXED_ORDER)]

    SERVICE_TO_ID = {svc: i for i, svc in enumerate(FIXED_ORDER)}
    df["service_id"] = df["service"].map(SERVICE_TO_ID)
    num_services = len(FIXED_ORDER)

    print("=== FIXED SERVICE → ID MAPPING ===")
    print(SERVICE_TO_ID)
    print("===================================")

    # ============================================================
    # FEATURE LIST
    # ============================================================

    input_cols = [
        "rps_1m",
        "latency_p95_ms",
        "cpu_norm",
        "mem_norm",
        "rps_roll_mean_5m",
        "rps_roll_mean_15m",
        "rps_lag_1m",
        "cpu_lag_1m",
        "mem_lag_1m",
        "hour",
        "dow"
    ]

    target_cols = ["rps_future", "cpu_future", "mem_future"]

    df = df.dropna(subset=target_cols)
    df = df[input_cols + target_cols + ["service_id"]].dropna().reset_index(drop=True)

    # ==== SCALE ====
    scaler = MinMaxScaler()
    X_scaled = scaler.fit_transform(df[input_cols])
    y = df[target_cols].values
    svc = df["service_id"].values

    # ==== WINDOWING ====
    def make_windows(X, y, svc, window):
        Xs, ys, svcs = [], [], []
        for i in range(len(X) - window):
            Xs.append(X[i:i+window])
            ys.append(y[i+window])
            svcs.append(svc[i:i+window])
        return np.array(Xs), np.array(ys), np.array(svcs)

    X, y, S = make_windows(X_scaled, y, svc, WINDOW_SIZE)

    train_size = int(len(X) * 0.8)
    X_train, y_train, S_train = X[:train_size], y[:train_size], S[:train_size]
    X_val, y_val, S_val = X[train_size:], y[train_size:], S[train_size:]

    print(f"[INFO] X_train={X_train.shape}, S_train={S_train.shape}")

    # ==== MLFLOW ====
    mlflow.set_tracking_uri(MLFLOW_TRACKING_URI)
    mlflow.set_experiment("lstm_forecast")

    with mlflow.start_run() as run:
        run_id = run.info.run_id
        print(f"[RUN] MLflow run_id = {run_id}")

        mlflow.log_param("window_size", WINDOW_SIZE)
        mlflow.log_param("epochs", EPOCHS)
        mlflow.log_param("batch_size", BATCH)
        mlflow.log_param("fixed_service_mapping", str(SERVICE_TO_ID))
        mlflow.log_param("input_features", str(input_cols))

        # ==== MODEL ====
        ts_input = Input(shape=(WINDOW_SIZE, X.shape[2]), name="timeseries")
        svc_input = Input(shape=(WINDOW_SIZE,), name="service_id")

        emb = Embedding(input_dim=num_services, output_dim=4, name="service_embedding")(svc_input)
        merged = Concatenate(axis=-1)([ts_input, emb])

        x = LSTM(128, return_sequences=True)(merged)
        x = Dropout(0.2)(x)
        x = LSTM(64)(x)
        out = Dense(3)(x)

        model = Model(inputs=[ts_input, svc_input], outputs=out)
        model.compile(optimizer=Adam(1e-3), loss="mae")

        # ==== TRAIN ====
        history = model.fit(
            [X_train, S_train], y_train,
            validation_data=([X_val, S_val], y_val),
            epochs=EPOCHS, batch_size=BATCH, verbose=1
        )

        # ==== EVAL ====
        y_pred = model.predict([X_val, S_val])

        # -------------------
        # SAFE MAPE (global)
        # -------------------
        m_rps = safe_mape(y_val[:,0], y_pred[:,0], eps=1e-3)
        m_cpu = safe_mape(y_val[:,1], y_pred[:,1], eps=1e-4)
        m_mem = safe_mape(y_val[:,2], y_pred[:,2], eps=1e-4)

        mlflow.log_metric("val_mape_rps", m_rps)
        mlflow.log_metric("val_mape_cpu", m_cpu)
        mlflow.log_metric("val_mape_mem", m_mem)

        # -------------------
        # MAE (global)
        # -------------------
        mae_rps = mean_absolute_error(y_val[:,0], y_pred[:,0])
        mae_cpu = mean_absolute_error(y_val[:,1], y_pred[:,1])
        mae_mem = mean_absolute_error(y_val[:,2], y_pred[:,2])

        mlflow.log_metric("val_mae_rps", mae_rps)
        mlflow.log_metric("val_mae_cpu", mae_cpu)
        mlflow.log_metric("val_mae_mem", mae_mem)

        print("=== GLOBAL METRICS ===")
        print("MAPE RPS:", m_rps)
        print("MAPE CPU:", m_cpu)
        print("MAPE MEM:", m_mem)
        print("MAE  RPS:", mae_rps)
        print("MAE  CPU:", mae_cpu)
        print("MAE  MEM:", mae_mem)

        # ==============================================================
        # PER-SERVICE METRICS (RPS ONLY) — SAFE, FILTER ZERO TARGETS
        # ==============================================================

        print("=== PER-SERVICE MAPE/MAE (RPS) ===")

        S_last = S_val[:, -1]

        for svc_name, svc_id in SERVICE_TO_ID.items():
            mask = (S_last == svc_id) & (np.abs(y_val[:,0]) > 1e-3)

            if not np.any(mask):
                print(f"[WARN] No valid samples for {svc_name}")
                continue

            svc_mape = safe_mape(y_val[mask,0], y_pred[mask,0])
            svc_mae  = mean_absolute_error(y_val[mask,0], y_pred[mask,0])

            mlflow.log_metric(f"val_mape_rps_{svc_name}", float(svc_mape))
            mlflow.log_metric(f"val_mae_rps_{svc_name}", float(svc_mae))

            print(f"{svc_name}: MAPE={svc_mape:.4f}, MAE={svc_mae:.4f}")

        # ==== SAVE MODEL ====
        mlflow.keras.log_model(
            model,
            artifact_path="model",
            registered_model_name="lstm_forecast"
        )

    print("[DONE] Training complete with enhanced metrics logging]")
