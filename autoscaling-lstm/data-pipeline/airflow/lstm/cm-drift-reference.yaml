apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-reference-script
  namespace: cronjob
data:
  save_reference.py: |
    import os, sys, math, json, hashlib, random
    from io import BytesIO
    import numpy as np
    import pandas as pd
    import pyarrow as pa
    import pyarrow.parquet as pq
    import s3fs
    from datetime import datetime, timedelta, timezone
    from zoneinfo import ZoneInfo

    # Evidently (image đã có)
    try:
        import evidently
        EVIDENTLY_VERSION = getattr(evidently, "__version__", "unknown")
    except Exception:
        evidently = None
        EVIDENTLY_VERSION = None

    # =============================
    # Helpers
    # =============================
    def md5_list(items):
        s = "|".join(map(str, items))
        return hashlib.md5(s.encode("utf-8")).hexdigest()

    def set_global_seed(seed: int):
        os.environ["PYTHONHASHSEED"] = str(seed)
        random.seed(seed)
        np.random.seed(seed)

    def _ensure_datetime_series(s: pd.Series) -> pd.Series:
        if not pd.api.types.is_datetime64_any_dtype(s):
            s = pd.to_datetime(s, errors="coerce")
        return s

    def write_parquet_to_s3(fs, bucket: str, key: str, df: pd.DataFrame):
        table = pa.Table.from_pandas(df, preserve_index=False)
        buf = BytesIO()
        pq.write_table(table, buf, compression="snappy")
        buf.seek(0)
        with fs.open(f"{bucket}/{key}", "wb") as fobj:
            fobj.write(buf.getvalue())

    # =============================
    # ENV (match train_lstm.py)
    # =============================
    S3_ENDPOINT = os.getenv("S3_ENDPOINT")
    AWS_KEY = os.getenv("AWS_ACCESS_KEY_ID")
    AWS_SECRET = os.getenv("AWS_SECRET_ACCESS_KEY")
    SILVER_PREFIX = os.getenv("SILVER_PREFIX", "silver/metrics")
    BUCKET = os.getenv("S3_BUCKET", "datalake")

    TRAIN_FRAC = float(os.getenv("TRAIN_FRAC", "0.80"))
    VAL_FRAC   = float(os.getenv("VAL_FRAC", "0.10"))
    if TRAIN_FRAC <= 0 or VAL_FRAC <= 0 or (TRAIN_FRAC + VAL_FRAC) >= 1.0:
        print("[ERROR] Invalid TRAIN_FRAC/VAL_FRAC", file=sys.stderr)
        sys.exit(1)
    TEST_FRAC = 1.0 - TRAIN_FRAC - VAL_FRAC

    HORIZON_MINUTES = int(os.getenv("HORIZON_MINUTES", "5"))
    HORIZON_NS = int(HORIZON_MINUTES) * 60 * 1_000_000_000

    EXTRA_EMBARGO_MINUTES = int(os.getenv("EXTRA_EMBARGO_MINUTES", "0"))
    EXTRA_EMBARGO_NS = int(EXTRA_EMBARGO_MINUTES) * 60 * 1_000_000_000

    DATE_FRACTION = float(os.getenv("DATE_FRACTION", "1.0"))
    DATE_PICK_MODE = os.getenv("DATE_PICK_MODE", "all").lower()
    DATE_SEED = int(os.getenv("DATE_SEED", "42"))
    set_global_seed(DATE_SEED)

    TZ_NAME = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")
    try:
        TZ = ZoneInfo(TZ_NAME)
    except Exception:
        TZ = timezone.utc

    FORCE_HTTP = os.getenv("AWS_STORAGE_FORCE_HTTP", "false").lower() == "true"
    client_args = {"endpoint_url": S3_ENDPOINT}
    if FORCE_HTTP:
        client_args["verify"] = False

    # where to save reference
    # NOTE: default must match train_lstm.py
    MODEL_NAME = os.getenv("MODEL_NAME", "lstm_forecast").strip() or "lstm_forecast"
    REF_PREFIX = os.getenv("REF_PREFIX", "drift/reference")  # in BUCKET
    REF_TAG = os.getenv("REF_TAG") or datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")

    # controls
    PER_SERVICE = os.getenv("REF_PER_SERVICE", "true").lower() == "true"
    REF_MAX_ROWS_PER_SERVICE = int(os.getenv("REF_MAX_ROWS_PER_SERVICE", "200000"))  # cap size
    SAVE_LATEST_POINTER = os.getenv("SAVE_LATEST_POINTER", "true").lower() == "true"
    SAVE_COMBINED = os.getenv("SAVE_COMBINED", "true").lower() == "true"

    # service list (match train)
    FIXED_ORDER = ["api-gateway", "authentication-service", "order-service", "payment-service", "product-service"]
    SERVICE_TO_ID = {svc: i for i, svc in enumerate(FIXED_ORDER)}

    # =============================
    # PSI FEATURES ONLY (keep to avoid breaking current drift job)
    # If you later want drift aligned to full LSTM input_cols,
    # expand here and compute the extra columns accordingly.
    # =============================
    input_cols = ["rps_1m_log1p", "cpu_norm", "mem_norm"]
    base_cols_required = ["ts", "rps_1m", "cpu_norm", "mem_norm"]

    # =============================
    # Load silver (same partition scan as train)
    # =============================
    print(f"[INFO] Start reference snapshot | model={MODEL_NAME} tag={REF_TAG} horizon_min={HORIZON_MINUTES} split={int(TRAIN_FRAC*100)}/{int(VAL_FRAC*100)}/{int(TEST_FRAC*100)}")
    print(f"[INFO] DatePick | fraction={DATE_FRACTION} mode={DATE_PICK_MODE} seed={DATE_SEED} tz={TZ_NAME} embargo_min={EXTRA_EMBARGO_MINUTES}")

    fs = s3fs.S3FileSystem(key=AWS_KEY, secret=AWS_SECRET, client_kwargs=client_args)
    prefix = f"{BUCKET}/{SILVER_PREFIX}/"
    svc_paths = fs.glob(prefix + "date=*/service=*/")
    if not svc_paths:
        print(f"[ERROR] No silver folders under {prefix}", file=sys.stderr)
        sys.exit(1)

    all_dates = set()
    for p in svc_paths:
        try:
            d = p.split("/date=")[1].split("/")[0]
            all_dates.add(d)
        except Exception:
            pass
    dates_sorted = sorted(all_dates)
    if not dates_sorted:
        print("[ERROR] No date partitions found.", file=sys.stderr)
        sys.exit(1)

    if 0.0 < DATE_FRACTION < 1.0:
        k = max(1, int(math.ceil(len(dates_sorted) * DATE_FRACTION)))
        if DATE_PICK_MODE == "first":
            picked_dates = dates_sorted[:k]
        elif DATE_PICK_MODE == "hash":
            rng = np.random.default_rng(DATE_SEED)
            idx = np.sort(rng.choice(len(dates_sorted), size=k, replace=False))
            picked_dates = sorted([dates_sorted[i] for i in idx])
        else:
            picked_dates = dates_sorted[-k:]
    else:
        picked_dates = dates_sorted

    picked_set = set(picked_dates)
    picked_hash = md5_list(picked_dates)

    dfs = []
    for path in svc_paths:
        try:
            date_part = path.split("/date=")[1].split("/")[0]
            service = path.split("/service=")[1].split("/")[0]
            if date_part not in picked_set:
                continue
            if service not in SERVICE_TO_ID:
                continue
            parquet_files = sorted(fs.glob(f"{prefix}date={date_part}/service={service}/part-*.parquet"))
            for f in parquet_files:
                with fs.open(f, "rb") as fobj:
                    _df = pq.read_table(fobj).to_pandas()
                    _df["service"] = service
                    _df["service_id"] = int(SERVICE_TO_ID[service])
                    _df["date_part"] = date_part
                    dfs.append(_df)
        except Exception:
            continue

    if not dfs:
        print("[ERROR] No parquet loaded (after date filtering).", file=sys.stderr)
        sys.exit(1)

    df = pd.concat(dfs, ignore_index=True)

    # Stable ordering like train_lstm.py
    df["__row_order"] = np.arange(len(df), dtype=np.int64)

    if "ts" not in df.columns:
        print("[ERROR] Missing column ts in silver.", file=sys.stderr)
        sys.exit(1)

    df["ts"] = pd.to_datetime(df["ts"], errors="coerce")
    df = df.dropna(subset=["ts"])

    # Dedupe stable: service + ts keep last by __row_order (match train intent)
    df = (
        df.sort_values(["service", "ts", "__row_order"])
        .drop_duplicates(subset=["service", "ts"], keep="last")
        .reset_index(drop=True)
    )

    missing = [c for c in base_cols_required if c not in df.columns]
    if missing:
        print(f"[ERROR] Missing columns in silver: {missing}", file=sys.stderr)
        sys.exit(1)

    keep_cols = base_cols_required + ["service", "service_id", "date_part", "__row_order"]
    df = df[keep_cols].dropna().reset_index(drop=True)

    # =============================
    # Compute split boundaries (match train_lstm.py behavior)
    # - if >=3 date partitions: use date_partitions
    # - else: fallback to timestamp quantiles
    # =============================
    def to_utc_ns_day_start(day_str: str) -> int:
        t = pd.Timestamp(day_str, tz=TZ).tz_convert("UTC")
        return int(t.value)

    def next_day_str(day_str: str) -> str:
        d = datetime.strptime(day_str, "%Y-%m-%d").date()
        return (d + timedelta(days=1)).strftime("%Y-%m-%d")

    def to_ts_utc_ns(series: pd.Series):
        s = _ensure_datetime_series(series)
        if pd.api.types.is_datetime64tz_dtype(s):
            s_utc = s.dt.tz_convert("UTC")
        else:
            try:
                s_utc = s.dt.tz_localize(TZ).dt.tz_convert("UTC")
            except Exception:
                s_utc = pd.to_datetime(s, errors="coerce", utc=True)
        s_utc = s_utc.dropna()
        return s_utc.view("int64").to_numpy(dtype=np.int64), s_utc.index

    n_dates = len(picked_dates)
    split_mode = "date_partitions"

    if n_dates >= 3:
        train_end_i = int(math.floor(n_dates * TRAIN_FRAC))
        val_end_i   = int(math.floor(n_dates * (TRAIN_FRAC + VAL_FRAC)))

        train_end_i = max(1, min(train_end_i, n_dates - 2))
        val_end_i   = max(train_end_i + 1, min(val_end_i, n_dates - 1))

        train_end_day = picked_dates[train_end_i]
        val_end_day   = picked_dates[val_end_i]

        train_end_ns = to_utc_ns_day_start(train_end_day)  # val starts
        val_end_ns   = to_utc_ns_day_start(val_end_day)    # test starts
        data_end_ns  = to_utc_ns_day_start(next_day_str(picked_dates[-1]))
    else:
        split_mode = "timestamp_quantiles_fallback"
        ts_ns_all, _ = to_ts_utc_ns(df["ts"])
        ts_ns_all = np.unique(ts_ns_all)
        ts_ns_all.sort()
        if ts_ns_all.size < 50:
            print("[ERROR] Not enough timestamps to create stable split fallback.", file=sys.stderr)
            sys.exit(1)

        i80 = int(math.floor(ts_ns_all.size * TRAIN_FRAC))
        i90 = int(math.floor(ts_ns_all.size * (TRAIN_FRAC + VAL_FRAC)))
        i80 = max(1, min(i80, ts_ns_all.size - 2))
        i90 = max(i80 + 1, min(i90, ts_ns_all.size - 1))

        train_end_ns = int(ts_ns_all[i80])
        val_end_ns   = int(ts_ns_all[i90])
        data_end_ns  = int(ts_ns_all[-1]) + int(24 * 60 * 60 * 1_000_000_000)  # +1 day buffer

        train_end_day = "n/a"
        val_end_day = "n/a"

    train_target_cut_ns = int(train_end_ns) - int(EXTRA_EMBARGO_NS)

    # =============================
    # Build reference (per-service), leakage-safe
    # Condition aligned with train logic:
    # use rows where (ts + horizon) < train_target_cut_ns
    # =============================
    per_service_refs = {}
    for svc in FIXED_ORDER:
        g = df[df["service"] == svc].copy()
        if g.empty:
            continue

        ts_ns, idx = to_ts_utc_ns(g["ts"])
        g = g.loc[idx].copy()
        g["ts_utc_ns"] = ts_ns

        # rps_1m -> rps_1m_log1p
        x = np.clip(g["rps_1m"].astype(float).values, 0.0, None)
        g["rps_1m_log1p"] = np.log1p(x).astype(np.float32)

        # cast cpu/mem for stability
        g["cpu_norm"] = g["cpu_norm"].astype(np.float32)
        g["mem_norm"] = g["mem_norm"].astype(np.float32)

        # leakage-safe: ts + horizon < train_target_cut_ns
        m = (g["ts_utc_ns"].values.astype(np.int64) + np.int64(HORIZON_NS)) < np.int64(train_target_cut_ns)
        g = g[m].copy()
        if g.empty:
            continue

        # cap size
        if len(g) > REF_MAX_ROWS_PER_SERVICE:
            g = g.tail(REF_MAX_ROWS_PER_SERVICE).copy()

        out_cols = input_cols + ["service", "service_id", "ts_utc_ns", "date_part"]
        g = g[out_cols].dropna().reset_index(drop=True)
        per_service_refs[svc] = g

    if not per_service_refs:
        print("[ERROR] Empty reference after filtering.", file=sys.stderr)
        sys.exit(1)

    # =============================
    # Save to S3
    # =============================
    base_key = f"{REF_PREFIX}/model={MODEL_NAME}/tag={REF_TAG}"
    meta_key = f"{base_key}/meta.json"
    latest_key = f"{REF_PREFIX}/model={MODEL_NAME}/latest.json"

    per_service_keys = {}
    total_rows = 0

    if PER_SERVICE:
        for svc, g in per_service_refs.items():
            svc_key = f"{base_key}/service={svc}/ref.parquet"
            write_parquet_to_s3(fs, BUCKET, svc_key, g)
            per_service_keys[svc] = svc_key
            total_rows += int(len(g))
            print(f"[INFO] Saved per-service ref | {svc} -> s3://{BUCKET}/{svc_key} rows={len(g)}")

    combined_key = None
    if SAVE_COMBINED:
        ref_df = pd.concat(list(per_service_refs.values()), ignore_index=True)
        combined_key = f"{base_key}/ref.parquet"
        write_parquet_to_s3(fs, BUCKET, combined_key, ref_df)
        if not PER_SERVICE:
            total_rows = int(len(ref_df))
        print(f"[INFO] Saved combined ref | s3://{BUCKET}/{combined_key} rows={len(ref_df)}")

    meta = {
        "model_name": MODEL_NAME,
        "ref_tag": REF_TAG,
        "created_at_utc": datetime.utcnow().isoformat() + "Z",

        "date_fraction": DATE_FRACTION,
        "date_pick_mode": DATE_PICK_MODE,
        "date_seed": DATE_SEED,

        "picked_dates_start": picked_dates[0] if picked_dates else None,
        "picked_dates_end": picked_dates[-1] if picked_dates else None,
        "picked_dates_count": len(picked_dates),
        "picked_dates_hash": picked_hash,

        "split_mode": split_mode,
        "train_frac": TRAIN_FRAC,
        "val_frac": VAL_FRAC,
        "test_frac": TEST_FRAC,

        "train_end_day": train_end_day,
        "val_end_day": val_end_day,
        "train_end_ns": int(train_end_ns),
        "val_end_ns": int(val_end_ns),
        "data_end_ns": int(data_end_ns),

        "extra_embargo_minutes": EXTRA_EMBARGO_MINUTES,
        "train_target_cut_ns": int(train_target_cut_ns),
        "horizon_minutes": HORIZON_MINUTES,

        "psi_features_only": True,
        "features": input_cols,
        "services": FIXED_ORDER,

        "per_service": PER_SERVICE,
        "ref_max_rows_per_service": REF_MAX_ROWS_PER_SERVICE,
        "rows_total": int(total_rows),

        "combined_ref_s3_key": combined_key,
        "per_service_ref_s3_keys": per_service_keys,

        "evidently_version": EVIDENTLY_VERSION,
    }

    with fs.open(f"{BUCKET}/{meta_key}", "wb") as fobj:
        fobj.write(json.dumps(meta, ensure_ascii=False, indent=2).encode("utf-8"))

    if SAVE_LATEST_POINTER:
        with fs.open(f"{BUCKET}/{latest_key}", "wb") as fobj:
            fobj.write(json.dumps(meta, ensure_ascii=False, indent=2).encode("utf-8"))

    print(f"[DONE] Saved meta      | s3://{BUCKET}/{meta_key}")
    if SAVE_LATEST_POINTER:
        print(f"[DONE] Updated latest | s3://{BUCKET}/{latest_key}")
