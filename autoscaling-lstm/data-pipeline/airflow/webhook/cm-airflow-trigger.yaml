apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-trigger-script
  namespace: airflow
data:
  app.py: |
    import os
    import time
    import hashlib
    from datetime import datetime, timezone
    from urllib.parse import unquote_plus

    import requests
    from fastapi import FastAPI, Request, HTTPException

    AIRFLOW_BASE = os.getenv("AIRFLOW_BASE", "http://airflow-api-server.airflow.svc.cluster.local:8080").rstrip("/")
    DAG_ID = os.getenv("DAG_ID", "drift_psi")

    # basic: dùng username/password để lấy JWT qua /auth/token
    # bearer: dùng AIRFLOW_TOKEN (JWT) có sẵn
    AIRFLOW_AUTH_MODE = os.getenv("AIRFLOW_AUTH_MODE", "basic").lower()
    AIRFLOW_TOKEN = os.getenv("AIRFLOW_TOKEN", "")
    AIRFLOW_USERNAME = os.getenv("AIRFLOW_USERNAME", "")
    AIRFLOW_PASSWORD = os.getenv("AIRFLOW_PASSWORD", "")

    PREFIX = os.getenv("WATCH_PREFIX", "drift/current/metrics/")
    SUFFIX = os.getenv("WATCH_SUFFIX", ".parquet")
    REQUIRE_OBJECT_CREATED = os.getenv("REQUIRE_OBJECT_CREATED", "true").lower() == "true"

    app = FastAPI()

    _token_cache = {"token": "", "exp_ts": 0.0}

    def _now_iso_utc() -> str:
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def _get_jwt_token() -> str:
        if AIRFLOW_AUTH_MODE == "bearer" and AIRFLOW_TOKEN:
            return AIRFLOW_TOKEN

        now = time.time()
        if _token_cache["token"] and now < _token_cache["exp_ts"]:
            return _token_cache["token"]

        if not (AIRFLOW_USERNAME and AIRFLOW_PASSWORD):
            raise RuntimeError("Missing AIRFLOW_USERNAME/AIRFLOW_PASSWORD for auth/token")

        r = requests.post(
            f"{AIRFLOW_BASE}/auth/token",
            json={"username": AIRFLOW_USERNAME, "password": AIRFLOW_PASSWORD},
            timeout=10,
        )
        if r.status_code >= 300:
            raise RuntimeError(f"Auth token failed: {r.status_code} {r.text}")

        token = r.json().get("access_token") or ""
        if not token:
            raise RuntimeError("Auth token response missing access_token")

        _token_cache["token"] = token
        _token_cache["exp_ts"] = now + 50.0
        return token

    def trigger_dag(bucket: str, object_key: str):
        token = _get_jwt_token()
        logical_date = _now_iso_utc()

        base = f"{bucket}:{object_key}:{logical_date}"
        h = hashlib.sha1(base.encode("utf-8")).hexdigest()[:12]
        run_id = f"minio__{h}"

        url = f"{AIRFLOW_BASE}/api/v2/dags/{DAG_ID}/dagRuns"
        payload = {
            "logical_date": logical_date,
            "dag_run_id": run_id,
            "conf": {"bucket": bucket, "object_key": object_key},
        }
        headers = {
            "Content-Type": "application/json",
            "Authorization": f"Bearer {token}",
        }

        r = requests.post(url, json=payload, headers=headers, timeout=15)
        if r.status_code >= 300:
            raise RuntimeError(f"Airflow trigger failed: {r.status_code} {r.text}")
        return r.json()

    @app.get("/health")
    def health():
        return {"ok": True}

    @app.post("/minio")
    async def minio_hook(req: Request):
        body = await req.json()

        records = body.get("Records") or body.get("records") or []
        if not records:
            raise HTTPException(400, "No Records in event")

        runs = []
        for rec in records:
            if REQUIRE_OBJECT_CREATED:
                evt = rec.get("eventName") or rec.get("event_name") or rec.get("EventName") or ""
                if "ObjectCreated" not in evt:
                    continue

            s3 = rec.get("s3", {}) or {}
            bucket = ((s3.get("bucket", {}) or {}).get("name")) or ""
            obj = ((s3.get("object", {}) or {}).get("key")) or ""
            if not bucket or not obj:
                continue

            obj = unquote_plus(obj)

            if PREFIX and not obj.startswith(PREFIX):
                continue
            if SUFFIX and not obj.endswith(SUFFIX):
                continue

            runs.append(trigger_dag(bucket, obj))

        return {"ok": True, "triggered": len(runs), "runs": runs}