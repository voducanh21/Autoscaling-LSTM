apiVersion: v1
kind: ConfigMap
metadata:
    name: bronze-metrics-script
    namespace: airflow
data:
    metrics_dumper.py: |
      # 🥉 Bronze Layer — sample 1 point per minute in last 5 minutes (≈5 points)
      import os, sys, requests, pandas as pd
      from datetime import datetime, timedelta, timezone
      from zoneinfo import ZoneInfo
      
      PROM_URL    = os.getenv("PROM_URL")
      BUCKET      = os.getenv("S3_BUCKET", "datalake")
      PREFIX      = os.getenv("S3_PREFIX", "bronze/metrics")
      S3_ENDPOINT = os.getenv("S3_ENDPOINT")
      AWS_KEY     = os.getenv("AWS_ACCESS_KEY_ID")
      AWS_SECRET  = os.getenv("AWS_SECRET_ACCESS_KEY")
      TZ_NAME     = os.getenv("TIMEZONE", "Asia/Ho_Chi_Minh")
      
      try:
          TZ = ZoneInfo(TZ_NAME)
      except Exception:
          print(f"[WARN] ZoneInfo('{TZ_NAME}') not available. Fallback to UTC.", file=sys.stderr)
          TZ = timezone.utc
      
      storage_opts = {
          "key": AWS_KEY,
          "secret": AWS_SECRET,
          "client_kwargs": {"endpoint_url": S3_ENDPOINT}
      }
      
      def prom_query_range(query, minutes=5, step="1m"):
          """Query Prometheus for the last N minutes, 1-minute step (~5 points)."""
          end = datetime.now(timezone.utc)
          start = end - timedelta(minutes=minutes)
          r = requests.get(
              f"{PROM_URL}/api/v1/query_range",
              params={"query": query, "start": start.timestamp(), "end": end.timestamp(), "step": step},
              timeout=15,
          )
          r.raise_for_status()
          return r.json()["data"]["result"]
      
      def collect_series(service):
          metrics = {
              "rps_1m": f'svc:qps:rate1m{{job="{service}"}}',
              "latency_p95_ms": f'svc:latency_p95_ms_1m{{job="{service}"}}',
              "cpu_cores_1m": f'sum(pod:cpu:usage1m{{namespace="apps",pod=~"{service}-.*"}})',
              "mem_bytes": f'sum(pod:mem:usage{{namespace="apps",pod=~"{service}-.*"}})',
          }
          
          dfs = []
          for name, query in metrics.items():
              res = prom_query_range(query)
              if not res:
                  continue
              df = pd.DataFrame(res[0]["values"], columns=["ts", name])
              df["ts"] = pd.to_datetime(df["ts"], unit="s", utc=True)
              df[name] = df[name].astype(float)
              dfs.append(df)
          
          if not dfs:
              return pd.DataFrame()
          
          out = dfs[0]
          for d in dfs[1:]:
              out = pd.merge_asof(
                  out.sort_values("ts"),
                  d.sort_values("ts"),
                  on="ts",
                  direction="nearest",
                  tolerance=pd.Timedelta("30s"),
              )
          
          # Resample 1 point per minute
          out = (
              out.set_index("ts")
              .resample("1min")
              .mean()
              .interpolate(limit_direction="both")
              .reset_index()
          )
          
          out["service"] = service
          
          # Fix timezone conversion safely
          if out["ts"].dt.tz is None:
              out["ts"] = out["ts"].dt.tz_localize("UTC").dt.tz_convert(TZ)
          else:
              out["ts"] = out["ts"].dt.tz_convert(TZ)
          
          out["hour"] = out["ts"].dt.hour
          out["dow"] = out["ts"].dt.weekday
          return out
      
      def main():
          try:
              # Discover available services from Prometheus
              r = requests.get(f"{PROM_URL}/api/v1/series", params={"match[]": "svc:qps:rate1m"}, timeout=10)
              r.raise_for_status()
              jobs = {m["job"] for m in r.json()["data"] if "job" in m}
              if not jobs:
                  print("[WARN] No services discovered from svc:qps:rate1m")
                  return
              
              dfs = [collect_series(svc) for svc in sorted(jobs)]
              dfs = [d for d in dfs if not d.empty]
              if not dfs:
                  print("[WARN] No valid data collected")
                  return
              
              df = pd.concat(dfs, ignore_index=True)
              df = df.astype({
                  "rps_1m": "float64",
                  "latency_p95_ms": "float64",
                  "cpu_cores_1m": "float64",
                  "mem_bytes": "float64",
                  "hour": "int64",
                  "dow": "int64",
              })
              
              now = datetime.now(TZ)
              date = now.strftime("%Y-%m-%d")
              part = int(now.timestamp())
              
              for svc, sub in df.groupby("service"):
                  path = f"s3://{BUCKET}/{PREFIX}/date={date}/service={svc}/part-{part}.parquet"
                  sub.to_parquet(
                      path,
                      index=False,
                      engine="pyarrow",
                      storage_options=storage_opts,
                      use_dictionary=False,
                  )
                  print(f"[OK] wrote {path} (rows={len(sub)}, tz={TZ_NAME})")
          
          except Exception as e:
              print(f"[ERROR] {e}", file=sys.stderr)
              sys.exit(1)
      
      if __name__ == "__main__":
          main()
