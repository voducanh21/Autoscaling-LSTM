# Executor: dùng KubernetesExecutor (đơn giản, không cần Celery)
executor: KubernetesExecutor

# Kết nối tới Postgres Bitnami đã cài
data:
  metadataConnection:
    user: "airflow"
    pass: "airflowpass"
    protocol: "postgresql"
    host: "airflow-pg-postgresql.ops.svc.cluster.local"
    port: 5432
    db: "airflowdb"

# Tạo user admin mặc định
web:
  defaultUser:
    enabled: true
    username: admin
    password: admin

# Gắn secrets ENV cho toàn bộ pod
envFrom:
  - secretRef:
      name: airflow-secrets

# Git-sync DAGs (kéo từ repo của bạn)
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/voducanh21/Autoscaling-LSTM.git"
    branch: "main"
    subPath: "autoscaling-lstm/data-pipeline/dags"   # thư mục chứa các DAG trong repo
    depth: 1
    wait: 60
    maxFailures: 0

# (tuỳ chọn) cắm thêm volume chứa config/files nếu cần
# extraVolumes:
#   - name: extra-config
#     secret:
#       secretName: airflow-secrets
# extraVolumeMounts:
#   - name: extra-config
#     mountPath: /opt/airflow/extra

# Scheduler/Triggerer/Webserver resource thấp cho Minikube
scheduler:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  replicas: 1

triggerer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

webserver:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi


# Ingress (dựa trên addon ingress của Minikube)
ingress:
  enabled: true
  web:
    path: /
    hosts:
      - airflow.localtest.me
  api:
    enabled: false

# Logging/Persistence (đơn giản hoá; Minikube đủ xài)
logs:
  persistence:
    enabled: true
    size: 2Gi

# Bật chế độ cơ bản, tránh chạm vào probe schema
airflow:
  config:
    core:
      load_examples: "False"
    webserver:
      expose_stacktrace: "True"
