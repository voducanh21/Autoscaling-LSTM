<div class="max-w-4xl mx-auto mt-8 bg-white rounded-lg shadow-lg border border-gray-200">
  <!-- Header -->
  <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full" [ngClass]="getConnectionStatusClass()"></div>
      <h2 class="text-lg font-semibold">AnD Shop Auto-Adviser</h2>
    </div>
    <div class="flex items-center space-x-2">
      <span class="text-sm" [ngClass]="getConnectionStatusClass()">{{ getConnectionStatus() }}</span>
      <button 
        (click)="clearChat()" 
        class="text-white hover:text-gray-200 transition-colors"
        title="Clear chat history">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages Area -->
  <div 
    #chatMessages
    class="h-96 overflow-y-auto p-4 bg-gray-50 space-y-4"
    style="max-height: 500px;">
    
    <div *ngFor="let msg of messages; trackBy: trackByMessageId" class="flex">
      <!-- User Message -->
      <div *ngIf="msg.from === 'user'" class="flex justify-end w-full">
        <div class="max-w-xs lg:max-w-md">
          <div class="bg-blue-600 text-white p-3 rounded-lg rounded-tr-none">
            <p class="text-sm whitespace-pre-wrap">{{ msg.text }}</p>
          </div>
          <div class="text-xs text-gray-500 mt-1 text-right">
            {{ msg.timestamp | date:'HH:mm' }}
          </div>
        </div>
      </div>

      <!-- Bot Message -->
      <div *ngIf="msg.from === 'bot'" class="flex justify-start w-full">
        <div class="max-w-xs lg:max-w-md">
          <div class="flex items-start space-x-2">
            <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
              <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
              </svg>
            </div>
            <div>
              <div class="bg-white border border-gray-200 p-3 rounded-lg rounded-tl-none shadow-sm">
                <p class="text-sm text-gray-800 whitespace-pre-wrap">{{ msg.text }}</p>
              </div>
              <div class="text-xs text-gray-500 mt-1">
                {{ msg.timestamp | date:'HH:mm' }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading indicator for scroll -->
    <div *ngIf="isLoading" class="flex justify-start w-full">
      <div class="max-w-xs lg:max-w-md">
        <div class="flex items-start space-x-2">
          <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center flex-shrink-0">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
          </div>
          <div class="bg-white border border-gray-200 p-3 rounded-lg rounded-tl-none shadow-sm">
            <div class="flex space-x-1">
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-4 border-t border-gray-200">
    <div class="flex space-x-3">
      <div class="flex-1">
        <textarea
          [(ngModel)]="userInput"
          (keydown)="onKeyPress($event)"
          [disabled]="isLoading"
          class="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter your question... (Enter to send, Shift+Enter for new line)"
          rows="2"
          maxlength="1000">
        </textarea>
        <div class="text-xs text-gray-500 mt-1 text-right">
          {{ userInput.length }}/1000
        </div>
      </div>
      <button 
        (click)="send()" 
        [disabled]="!userInput.trim() || isLoading"
        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <span *ngIf="!isLoading">Send</span>
        <div *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
      </button>
    </div>
  </div>

  
</div>
