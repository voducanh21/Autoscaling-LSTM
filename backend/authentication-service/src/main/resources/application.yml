server:
  port: 8084

jwt:
  secret: ${JWT_SECRET}
app:
  jwttoken:
    message: ${APP_JWTTOKEN_MESSAGE:token-created}

spring:
  application:
    name: AUTHENTICATION-SERVICE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

#  security:
#    oauth2:
#      client:
#        registration:
#          github:
#            clientId: ${GITHUB_CLIENT_ID}
#            clientSecret: ${GITHUB_CLIENT_SECRET}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    # bật histogram cho http.server.requests
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
