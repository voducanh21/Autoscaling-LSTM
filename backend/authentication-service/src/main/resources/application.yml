server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:esewa}
app:
  jwttoken:
    message: ${APP_JWTTOKEN_MESSAGE:esewa-is-my-secret-key}

spring:
  application:
    name: AUTHENTICATION-SERVICE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

