---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secrets
  namespace: infra
type: Opaque
data:
  MONGO_INITDB_ROOT_PASSWORD: cGFzc3dvcmQ=   # "password" -> base64
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: infra
data:
  MONGO_INITDB_ROOT_USERNAME: "root"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-script
  namespace: infra
data:
  init.js: |
    db = db.getSiblingDB('chatdb');
    db.createCollection('messages');

    db = db.getSiblingDB('orderdb');
    db.createCollection('orders');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: infra
spec:
  storageClassName: standard   # nếu dùng local thì bỏ dòng này hoặc đổi thành 'standard'
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: infra
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.5
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: mongo-config
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
        - name: init-script
          configMap:
            name: mongo-init-script
            items:
              - key: init.js
                path: init.js
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: infra
  labels:
    app: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  type: ClusterIP
