---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: infra
type: Opaque
data:
  mysql_root_password: cm9vdA==  # base64 của "root"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb-config
  namespace: infra
data:
  initdb.sql: |
    CREATE DATABASE IF NOT EXISTS userdb;
    CREATE DATABASE IF NOT EXISTS paymentdb;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: infra
spec:
  # --- CHANGED: dùng StorageClass "standard-wffc" để PV gắn đúng node role=app
  storageClassName: standard-wffc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi   # --- CHANGED: tăng từ 1Gi -> 5Gi (bạn có thể giữ 1Gi nếu muốn)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: infra
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # --- ADDED: ép MySQL chạy trên worker dành cho apps/infra/monitoring
      nodeSelector:
        role: app
      containers:
        - name: mysql
          image: mysql:8.3.0
          ports:
            - containerPort: 3306
          # --- ADDED: baseline resources để scheduler ổn định
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: mysql_root_password
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-initdb-config
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-initdb-config
          configMap:
            name: mysql-initdb-config

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: infra
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
