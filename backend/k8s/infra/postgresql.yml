---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: infra
type: Opaque
data:
  postgres_password: cm9vdA==     # base64 của "root"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb-config
  namespace: infra
data:
  initdb.sql: |
    CREATE DATABASE productdb;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: infra
spec:
  # --- CHANGED: dùng StorageClass "standard-wffc" để PV gắn đúng node role=app
  storageClassName: standard-wffc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi   # --- CHANGED: 1Gi -> 5Gi (tuỳ bạn, có thể giữ 1Gi nếu muốn)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: infra
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # --- ADDED: ép PostgreSQL chạy trên worker dành cho apps/infra/monitoring
      nodeSelector:
        role: app
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          # --- ADDED: baseline resources để scheduler ổn định
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres_password
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
            - mountPath: /docker-entrypoint-initdb.d
              name: postgres-initdb-config
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-initdb-config
          configMap:
            name: postgres-initdb-config

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
