apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: apps
  labels:
    app: authentication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m02
      containers:
        - name: authentication-service
          image: ducanhvo/new-authentication-service:latest
          ports:
            - name: http
              containerPort: 8084
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.infra.svc.cluster.local:3306/userdb
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: JWT_SECRET
              value: esewa
            - name: APP_JWTTOKEN_MESSAGE
              value: esewa-is-my-secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
  namespace: apps
  labels:
    app: authentication-service
spec:
  selector:
    app: authentication-service
  ports:
    - name: http
      protocol: TCP
      port: 8084
      targetPort: 8084
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 8084
  type: ClusterIP
