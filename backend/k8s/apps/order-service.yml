---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: apps
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m02

      containers:
        - name: order-service
          image: ducanhvo/new-order-service:latest  # đổi đúng tên image nếu cần
          ports:
            - name: http                 # ← giữ port HTTP
              containerPort: 8083
            - name: metrics              # ← thêm port “metrics” để Prometheus scrape
              containerPort: 8083
          # --- ADDED: baseline requests/limits để scheduler ổn định hơn
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://root:password@mongo.infra.svc.cluster.local:27017/orderdb?authSource=admin
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: apps
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http                     # ← port cho traffic ứng dụng
      protocol: TCP
      port: 8083
      targetPort: http
    - name: metrics                  # ← thêm port ClusterIP “metrics” cho Prometheus
      protocol: TCP
      port: 9090                     # ← port mới mà Prometheus sẽ gọi
      targetPort: metrics            # ← map về containerPort=8083 (port “metrics”)
  type: ClusterIP
