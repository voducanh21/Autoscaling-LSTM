---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: apps
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m02
      containers:
        - name: product-service
          image: ducanhvo/new-product-service:latest  # đổi tag nếu cần
          ports:
            - name: http                # ← giữ port HTTP
              containerPort: 8081
            - name: metrics             # ← thêm port “metrics” để Prometheus scrape
              containerPort: 8081
          # --- ADDED: baseline requests/limits để scheduler ổn định hơn
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/productdb
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: apps
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - name: http                     # ← port cho traffic ứng dụng
      protocol: TCP
      port: 8081
      targetPort: http
    - name: metrics                  # ← thêm port ClusterIP “metrics” cho Prometheus
      protocol: TCP
      port: 9090                     # ← port mới mà Prometheus sẽ gọi
      targetPort: metrics            # ← map về containerPort=8081 (port “metrics”)
  type: ClusterIP
