---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: apps
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # --- ADDED: ép pod chạy trên worker “apps/infra/monitoring”
      nodeSelector:
        kubernetes.io/hostname: k3n-m02
      containers:
        - name: api-gateway
          image: ducanhvo/new-api-gateway:latest
          ports:
            - name: http
              containerPort: 8888       # port chính dùng cho traffic ứng dụng
            - name: metrics
              containerPort: 8888       # cùng containerPort, để ServiceMonitor trỏ vào
          # --- ADDED: baseline requests/limits để scheduler đỡ nghẽn (điều chỉnh theo thực tế)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: PRODUCT_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: PAYMENT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: ORDER_SERVICE_URL
            - name: AUTHENTICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: AUTHENTICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: apps
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090                  # port ClusterIP mới dành cho Prometheus
      targetPort: metrics         # map về containerPort 8888
  type: ClusterIP
