apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: apps
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3n-m02
      containers:
        - name: api-gateway
          image: ducanhvo/new-api-gateway:latest
          ports:
            - name: http
              containerPort: 8888
            - name: management
              containerPort: 9090
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            # Run actuator on separate management port
            - name: MANAGEMENT_SERVER_PORT
              value: "9090"

            # Correct actuator base path property (NOT MANAGEMENT_SERVER_BASE_PATH)
            - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
              value: "/actuator"

            # Expose required endpoints
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "prometheus,health,info"

            # Ensure prometheus endpoint is enabled
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"

            # (optional safety) enable endpoints by default
            - name: MANAGEMENT_ENDPOINTS_ENABLED_BY_DEFAULT
              value: "true"

            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: PRODUCT_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: PAYMENT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: ORDER_SERVICE_URL
            - name: AUTHENTICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: AUTHENTICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: apps
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
