spring:
  main:
    web-application-type: reactive
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - DELETE
              - OPTIONS
              - PUT
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: PRODUCT-SERVICE
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        - id: PAYMENT-SERVICE
          uri: http://localhost:8082
          predicates:
            - Path=/api/payment/**

        - id: ORDER-SERVICE
          uri: http://localhost:8083
          predicates:
            - Path=/api/order/**

        - id: AUTHENTICATION-SERVICE
          uri: http://localhost:8084
          predicates:
            - Path=/api/auth/**

        - id: CHAT-SERVICE
          uri: http://localhost:8085
          predicates:
            - Path=/api/chat/**

server:
  port: 8888
